<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { background: var(--canvas); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--label-3); margin-bottom: 8px; }
</style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Field, IconButton } = window.FrostDesignSystemProse_5680eb;
  function Demo() {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
        <div>
          <div className="lbl">Search field · 36px</div>
          <Field icon="magnifying-glass" placeholder="搜索条款、资质或案例" defaultValue="" />
        </div>
        <div>
          <div className="lbl">Composer field · 44px, with send</div>
          <Field
            size="lg"
            icon="plus-circle"
            placeholder="向智能体描述下一步…"
            trailing={<IconButton icon="paper-plane-tilt" label="发送" filled />}
          />
        </div>
        <div>
          <div className="lbl">Disabled</div>
          <Field icon="lock-simple" placeholder="只读字段" disabled />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
