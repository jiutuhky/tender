<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Prose Workspace" description="Frost macOS agent workspace — glass window, sidebar, agent stream, bid-document outline" -->
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <style>
    @font-face { font-family: "_frost"; src: local("SF Pro Display"); }
    html,body{margin:0;}
  </style>
</helmet>

<div data-screen-label="Prose Workspace" style="min-height:100vh;display:grid;place-items:center;padding:40px;background:radial-gradient(1100px 700px at 12% -10%, #c8e6ff 0%, rgba(200,230,255,0) 58%),radial-gradient(900px 620px at 92% 6%, #8fc0f5 0%, rgba(143,192,245,0) 55%),radial-gradient(1100px 850px at 78% 100%, #0a4ecf 0%, rgba(10,78,207,0) 62%),radial-gradient(820px 640px at 14% 86%, #2e8fd8 0%, rgba(46,143,216,0) 58%),linear-gradient(162deg, #d4e8fb 0%, #6aa4e6 46%, #1c4796 100%);font-family:var(--font-ui);">
  <div style="width:min(1180px,100%);height:640px;border-radius:12px;overflow:hidden;box-shadow:0 28px 80px rgba(12,18,32,.26),0 8px 24px rgba(12,18,32,.12),0 0 0 .5px rgba(12,18,32,.10);display:grid;grid-template-rows:52px 1fr;background:#fff;">

    <!-- Toolbar -->
    <div style="display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--separator);background:rgba(255,255,255,.68);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);">
      <span style="display:flex;gap:8px;">
        <span style="width:12px;height:12px;border-radius:50%;background:#ff5f57;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#febc2e;"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#28c840;"></span>
      </span>
      <span style="font-size:13px;font-weight:600;color:var(--label);">仿真软件开发服务采购项目</span>
      <span style="font-size:13px;color:var(--label-3);">投标文件</span>
      <span style="flex:1;"></span>
      <button aria-label="切换侧栏" style="width:30px;height:30px;border:none;background:transparent;color:var(--label-2);border-radius:7px;display:grid;place-items:center;font-size:16px;cursor:pointer;"><i class="ph ph-sidebar-simple"></i></button>
      <div style="display:inline-flex;padding:2px;gap:2px;background:rgba(60,60,67,.09);border-radius:9px;">
        <button style="height:28px;padding:0 18px;border:none;border-radius:7px;font:inherit;font-size:13px;font-weight:600;color:var(--label);background:#fff;box-shadow:0 1px 3px rgba(18,24,38,.16),0 0 0 .5px rgba(18,24,38,.05);cursor:pointer;">编制</button>
        <button style="height:28px;padding:0 18px;border:none;border-radius:7px;font:inherit;font-size:13px;font-weight:500;color:var(--label-2);background:transparent;cursor:pointer;">预览</button>
      </div>
    </div>

    <!-- Body -->
    <div style="display:grid;grid-template-columns:216px 1fr 296px;min-height:0;">

      <!-- Sidebar (glass over wallpaper) -->
      <aside style="padding:14px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid rgba(60,60,67,.10);background:rgba(255,255,255,.55);backdrop-filter:blur(60px) saturate(180%);-webkit-backdrop-filter:blur(60px) saturate(180%);overflow:hidden;">
        <div style="font-size:11px;font-weight:600;color:var(--label-3);padding:12px 10px 5px;">项目</div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);background:var(--blue-soft);font-weight:600;"><i class="ph ph-folder-simple" style="font-size:15px;color:var(--blue);"></i>仿真软件开发服务采购</div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);"><i class="ph ph-folder-simple" style="font-size:15px;color:var(--label-2);"></i>智慧园区运维服务</div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);"><i class="ph ph-folder-simple" style="font-size:15px;color:var(--label-2);"></i>实验室设备购置</div>
        <div style="font-size:11px;font-weight:600;color:var(--label-3);padding:12px 10px 5px;">知识库</div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);"><i class="ph ph-identification-card" style="font-size:15px;color:var(--label-2);"></i><span style="flex:1;">资质证照</span><span style="font-size:11px;font-weight:600;color:var(--green-text);background:rgba(52,199,89,.15);padding:1px 8px;border-radius:999px;">12</span></div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);"><i class="ph ph-buildings" style="font-size:15px;color:var(--label-2);"></i>业绩案例</div>
        <div style="display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--label);"><i class="ph ph-files" style="font-size:15px;color:var(--label-2);"></i>人员简历</div>
      </aside>

      <!-- Agent stream -->
      <div style="background:var(--surface);display:flex;flex-direction:column;min-height:0;">
        <div style="flex:1;overflow:auto;padding:26px 30px 12px;display:flex;flex-direction:column;gap:18px;">
          <div style="align-self:flex-end;max-width:78%;background:var(--blue);color:#fff;padding:9px 15px;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.65;">解析这份招标文件的技术需求，生成技术需求清单。</div>
          <div style="max-width:88%;display:flex;flex-direction:column;gap:10px;">
            <span style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--separator);font-size:12px;color:var(--label-2);"><i class="ph ph-file-text" style="color:var(--blue);font-size:14px;"></i>已读取<span style="font-family:var(--font-mono);font-size:11px;color:var(--label-3);">招标文件.md</span></span>
            <span style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--separator);font-size:12px;color:var(--label-2);"><i class="ph ph-check-circle" style="color:var(--green-text);font-size:14px;"></i>技术需求解析完成</span>
            <p style="font-size:14px;line-height:1.75;color:var(--label);margin:0;">已从第三章提取全部技术需求条目，按 <strong style="font-weight:600;">功能、性能、接口、安全</strong> 四类归档，并标出了需要逐条响应的实质性条款。</p>
          </div>
        </div>
        <div style="padding:10px 22px 4px;display:flex;gap:8px;flex-wrap:wrap;">
          <button style="height:28px;padding:0 12px;border:none;border-radius:7px;font:inherit;font-size:12px;font-weight:600;color:var(--label);background:var(--surface);box-shadow:var(--elev-1);cursor:pointer;">生成技术偏差表</button>
          <button style="height:28px;padding:0 12px;border:none;border-radius:7px;font:inherit;font-size:12px;font-weight:600;color:var(--label);background:var(--surface);box-shadow:var(--elev-1);cursor:pointer;">插入资质证照</button>
        </div>
        <div style="padding:8px 22px 18px;">
          <label style="display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;background:var(--surface);border-radius:14px;box-shadow:var(--elev-1);">
            <i class="ph ph-plus-circle" style="color:var(--label-3);font-size:15px;"></i>
            <input type="text" placeholder="向智能体描述下一步…" style="border:none;outline:none;background:transparent;flex:1;font:inherit;font-size:13px;color:var(--label);">
            <button aria-label="发送" style="width:30px;height:30px;border-radius:50%;border:none;display:grid;place-items:center;color:#fff;font-size:14px;background:linear-gradient(180deg,#1979f2,var(--blue));cursor:pointer;"><i class="ph ph-paper-plane-tilt"></i></button>
          </label>
        </div>
      </div>

      <!-- Doc outline -->
      <aside style="background:var(--surface-2);border-left:1px solid var(--separator);padding:20px 18px;overflow:auto;">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:14px;color:var(--label);"><i class="ph ph-tree-structure" style="color:var(--blue);"></i>投标文件大纲</div>
        <div style="display:flex;flex-direction:column;gap:1px;font-size:12.5px;">
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;color:var(--label-2);"><i class="ph ph-caret-right" style="font-size:12px;color:var(--label-3);"></i>投标函及附录</div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;color:var(--label-2);"><i class="ph ph-caret-right" style="font-size:12px;color:var(--label-3);"></i>商务响应</div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;color:var(--label);font-weight:600;background:var(--surface);border-radius:7px;box-shadow:var(--elev-1);"><i class="ph ph-caret-down" style="font-size:12px;color:var(--blue);"></i>技术方案</div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px 6px 28px;color:var(--label-2);">技术需求响应<span style="margin-left:auto;font-size:11px;font-weight:600;color:var(--green-text);background:rgba(52,199,89,.15);padding:1px 8px;border-radius:999px;">已生成</span></div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px 6px 28px;color:var(--label-2);">技术偏差表<span style="margin-left:auto;font-size:11px;font-weight:600;color:var(--label-2);background:rgba(60,60,67,.10);padding:1px 8px;border-radius:999px;">草稿</span></div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;color:var(--label-2);"><i class="ph ph-caret-right" style="font-size:12px;color:var(--label-3);"></i>资质证明材料</div>
          <div style="display:flex;align-items:center;gap:8px;padding:6px 9px;color:var(--label-2);"><i class="ph ph-caret-right" style="font-size:12px;color:var(--label-3);"></i>报价表</div>
        </div>
      </aside>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
