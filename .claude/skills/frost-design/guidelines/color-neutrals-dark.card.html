<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals · Dark" subtitle="Near-black cold ramp for dark appearance" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: #0f0f11; padding: 18px; }
  .ramp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { background: #1e1e22; border-radius: var(--r-card); box-shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.06); overflow: hidden; }
  .chip { height: 58px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: #f5f5f7; display: block; }
  .val { font-family: var(--font-mono); font-size: 10px; color: #a8a8b3; }
</style>
</head>
<body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:#161618"></div><div class="meta"><span class="name">画布 Canvas</span><span class="val">#161618</span></div></div>
  <div class="sw"><div class="chip" style="background:#1e1e22;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)"></div><div class="meta"><span class="name">表面 Surface</span><span class="val">#1E1E22</span></div></div>
  <div class="sw"><div class="chip" style="background:#2a2a30"></div><div class="meta"><span class="name">表面二</span><span class="val">#2A2A30</span></div></div>
  <div class="sw"><div class="chip" style="background:#6e6e78"></div><div class="meta"><span class="name">三级文本</span><span class="val">#6E6E78</span></div></div>
  <div class="sw"><div class="chip" style="background:#a8a8b3"></div><div class="meta"><span class="name">次级文本</span><span class="val">#A8A8B3</span></div></div>
  <div class="sw"><div class="chip" style="background:#f5f5f7"></div><div class="meta"><span class="name">主文本 Label</span><span class="val">#F5F5F7</span></div></div>
</div>
</body>
</html>
