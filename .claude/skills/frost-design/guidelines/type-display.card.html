<!-- @dsCard group="Type" viewport="700x190" name="Display & Titles" subtitle="Large title → title-2, tight tracking" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 22px 24px; }
  .row { display: grid; grid-template-columns: 1fr 150px; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--separator); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--label-3); text-align: right; }
  .lt { font-size: 26px; font-weight: 700; letter-spacing: -.022em; line-height: 1.25; color: var(--label); }
  .t1 { font-size: 22px; font-weight: 600; letter-spacing: -.018em; color: var(--label); }
  .t2 { font-size: 17px; font-weight: 600; letter-spacing: -.012em; color: var(--label); }
</style>
</head>
<body>
<div class="row"><span class="lt">为每一份标书，配一个安静的工作台</span><span class="meta">Large · 26 / 700 / -2.2%</span></div>
<div class="row"><span class="t1">为每一份标书，配一个安静的工作台</span><span class="meta">Title 1 · 22 / 600 / -1.8%</span></div>
<div class="row"><span class="t2">为每一份标书，配一个安静的工作台</span><span class="meta">Title 2 · 17 / 600 / -1.2%</span></div>
</body>
</html>
