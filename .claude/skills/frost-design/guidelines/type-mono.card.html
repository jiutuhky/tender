<!-- @dsCard group="Type" viewport="700x130" name="Monospace · SF Mono" subtitle="Datums, file names, keyboard hints — tabular" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .cell { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: 14px 16px; }
  .cell .k { font-size: 11px; color: var(--label-3); margin-bottom: 8px; }
  .mono { font-family: var(--font-mono); font-size: 13px; color: var(--label); letter-spacing: 0; }
  .kbd { font-family: var(--font-mono); font-size: 11px; color: var(--label-3); border: 1px solid var(--separator); border-radius: 5px; padding: 2px 7px; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><div class="k">文件名 File</div><div class="mono">招标文件.md</div></div>
  <div class="cell"><div class="k">数值 Datum</div><div class="mono">¥1,284,500.00</div></div>
  <div class="cell"><div class="k">快捷键 Shortcut</div><span class="kbd">⌘</span> <span class="kbd">E</span> <span class="kbd">⌥</span> <span class="kbd">K</span></div>
</div>
</body>
</html>
