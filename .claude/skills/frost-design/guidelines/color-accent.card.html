<!-- @dsCard group="Colors" viewport="700x150" name="Accent · System Blue" subtitle="The single emphasis — interactive & in-progress only" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 18px; }
  .ramp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); overflow: hidden; }
  .chip { height: 58px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--label); display: block; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); }
  .note { margin-top: 12px; font-size: 12px; color: var(--label-2); }
  .note b { color: var(--blue); }
</style>
</head>
<body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:#0064e1"></div><div class="meta"><span class="name">系统蓝 · 浅</span><span class="val">#0064E1</span></div></div>
  <div class="sw"><div class="chip" style="background:#0052bc"></div><div class="meta"><span class="name">按压态 Pressed</span><span class="val">#0052BC</span></div></div>
  <div class="sw"><div class="chip" style="background:#409cff"></div><div class="meta"><span class="name">系统蓝 · 深</span><span class="val">#409CFF</span></div></div>
  <div class="sw"><div class="chip" style="background:rgba(0,100,225,.1)"></div><div class="meta"><span class="name">浅蓝衬底 Soft</span><span class="val">blue 10%</span></div></div>
</div>
<p class="note">One accent only. Blue is granted to exactly two meanings — <b>interactive</b> and <b>in-progress</b>. Decoration never spends color.</p>
</body>
</html>
