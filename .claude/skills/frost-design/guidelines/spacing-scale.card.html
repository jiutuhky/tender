<!-- @dsCard group="Spacing" viewport="700x140" name="Space scale" subtitle="4 → 104px rhythm" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 22px 24px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 22px; background: linear-gradient(180deg,#1979f2,var(--blue)); border-radius: 4px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); }
</style>
</head>
<body>
<div class="scale">
  <div class="item"><span class="bar" style="height:4px"></span><span class="cap">4 · 1</span></div>
  <div class="item"><span class="bar" style="height:8px"></span><span class="cap">8 · 2</span></div>
  <div class="item"><span class="bar" style="height:12px"></span><span class="cap">12 · 3</span></div>
  <div class="item"><span class="bar" style="height:16px"></span><span class="cap">16 · 4</span></div>
  <div class="item"><span class="bar" style="height:20px"></span><span class="cap">20 · 5</span></div>
  <div class="item"><span class="bar" style="height:28px"></span><span class="cap">28 · 6</span></div>
  <div class="item"><span class="bar" style="height:40px"></span><span class="cap">40 · 7</span></div>
  <div class="item"><span class="bar" style="height:56px"></span><span class="cap">56 · 8</span></div>
  <div class="item"><span class="bar" style="height:80px"></span><span class="cap">80 · 9</span></div>
</div>
</body>
</html>
