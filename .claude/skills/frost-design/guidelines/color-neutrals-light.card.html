<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals · Light" subtitle="Cold-gray ramp — canvas to primary text" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 18px; }
  .ramp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); overflow: hidden; }
  .chip { height: 58px; }
  .meta { padding: 8px 10px 10px; }
  .name { font-size: 12px; font-weight: 600; color: var(--label); display: block; }
  .val { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); }
</style>
</head>
<body>
<div class="ramp">
  <div class="sw"><div class="chip" style="background:#eef0f3"></div><div class="meta"><span class="name">画布 Canvas</span><span class="val">#EEF0F3</span></div></div>
  <div class="sw"><div class="chip" style="background:#fff;box-shadow:inset 0 0 0 1px var(--separator)"></div><div class="meta"><span class="name">表面 Surface</span><span class="val">#FFFFFF</span></div></div>
  <div class="sw"><div class="chip" style="background:#f5f6f8"></div><div class="meta"><span class="name">表面二</span><span class="val">#F5F6F8</span></div></div>
  <div class="sw"><div class="chip" style="background:#6b6b76"></div><div class="meta"><span class="name">三级文本</span><span class="val">#6B6B76</span></div></div>
  <div class="sw"><div class="chip" style="background:#55555e"></div><div class="meta"><span class="name">次级文本</span><span class="val">#55555E</span></div></div>
  <div class="sw"><div class="chip" style="background:#1d1d1f"></div><div class="meta"><span class="name">主文本 Label</span><span class="val">#1D1D1F</span></div></div>
</div>
</body>
</html>
