<!-- @dsCard group="Brand" viewport="700x220" name="Identity · Prose app icon" subtitle="Three stacked glass sheets — superellipse, fixed gradient" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--wallpaper); }
  .wrap { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; padding: 28px 32px; }
  .hero { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .hero img { width: 120px; height: 120px; filter: drop-shadow(0 16px 34px rgba(8,35,100,.4)); }
  .lockup { display: flex; align-items: center; gap: 11px; }
  .lockup img { width: 30px; height: 30px; }
  .lockup span { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: #fff; }
  .spec { background: rgba(255,255,255,.78); backdrop-filter: blur(40px) saturate(190%); -webkit-backdrop-filter: blur(40px) saturate(190%); border: 1px solid rgba(255,255,255,.5); border-radius: var(--r-card); padding: 18px 20px; }
  .spec h4 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--label); }
  .spec p { margin: 0 0 12px; font-size: 12px; color: var(--label-2); line-height: 1.6; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; }
  .sizes .it { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sizes .cap { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img src="../assets/frost-icon.svg" alt="Prose app icon">
    <div class="lockup"><img src="../assets/frost-icon.svg" alt=""><span>Prose</span></div>
  </div>
  <div class="spec">
    <h4>使用规则 Usage</h4>
    <p>圆角固定为边长 22.4%（超椭圆），不得改为正圆或直角。渐变方向固定左上→右下，不得旋转或镜像。除投影外不加任何装饰。</p>
    <div class="sizes">
      <span class="it"><img src="../assets/frost-icon.svg" width="56" height="56" alt=""><span class="cap">56</span></span>
      <span class="it"><img src="../assets/frost-icon.svg" width="40" height="40" alt=""><span class="cap">40</span></span>
      <span class="it"><img src="../assets/frost-icon.svg" width="24" height="24" alt=""><span class="cap">24</span></span>
      <span class="it"><img src="../assets/frost-icon.svg" width="16" height="16" alt=""><span class="cap">16</span></span>
    </div>
  </div>
</div>
</body>
</html>
