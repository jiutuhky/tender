<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="Depth replaces strokes — three shadow steps" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 26px 22px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tile { width: 100%; height: 64px; background: var(--surface); border-radius: var(--r-card); }
  .cap { text-align: center; }
  .n { font-size: 12px; font-weight: 600; color: var(--label); display: block; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); }
</style>
</head>
<body>
<div class="row">
  <div class="item"><span class="tile" style="box-shadow:var(--elev-1)"></span><span class="cap"><span class="n">Level 1 · 控件</span><span class="v">y1 b2 / 10% + .5px ring</span></span></div>
  <div class="item"><span class="tile" style="box-shadow:var(--elev-2)"></span><span class="cap"><span class="n">Level 2 · 卡片 / 浮层</span><span class="v">y10 b30 / 12%</span></span></div>
  <div class="item"><span class="tile" style="box-shadow:var(--elev-3)"></span><span class="cap"><span class="n">Level 3 · 窗口</span><span class="v">y28 b80 / 26%</span></span></div>
</div>
</body>
</html>
