<!-- @dsCard group="Colors" viewport="700x180" name="Semantic · Graphic / Text pairs" subtitle="Saturated for fills & dots, darkened for legible text" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pair { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: 14px 16px; }
  .head { font-size: 12px; font-weight: 700; color: var(--label); margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .duo { display: flex; gap: 8px; }
  .col { flex: 1; }
  .bar { height: 30px; border-radius: 7px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--label-3); margin-top: 5px; display: block; }
  .txt { font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
<div class="grid">
  <div class="pair">
    <div class="head"><span class="dot" style="background:#34c759"></span>成功 Success</div>
    <div class="duo">
      <div class="col"><div class="bar" style="background:#34c759"></div><span class="lbl">图形 #34C759</span></div>
      <div class="col"><div class="bar" style="display:grid;place-items:center;background:rgba(52,199,89,.15)"><span class="txt" style="color:#1d8f45">已生成</span></div><span class="lbl">文本 #1D8F45</span></div>
    </div>
  </div>
  <div class="pair">
    <div class="head"><span class="dot" style="background:#ff9500"></span>警示 Warning</div>
    <div class="duo">
      <div class="col"><div class="bar" style="background:#ff9500"></div><span class="lbl">图形 #FF9500</span></div>
      <div class="col"><div class="bar" style="display:grid;place-items:center;background:rgba(255,149,0,.15)"><span class="txt" style="color:#b25e00">待确认</span></div><span class="lbl">文本 #B25E00</span></div>
    </div>
  </div>
  <div class="pair">
    <div class="head"><span class="dot" style="background:#ff3b30"></span>危险 Danger</div>
    <div class="duo">
      <div class="col"><div class="bar" style="background:#ff3b30"></div><span class="lbl">图形 #FF3B30</span></div>
      <div class="col"><div class="bar" style="display:grid;place-items:center;background:rgba(255,59,48,.13)"><span class="txt" style="color:#d70015">偏差</span></div><span class="lbl">文本 #D70015</span></div>
    </div>
  </div>
</div>
</body>
</html>
