<!-- @dsCard group="Type" viewport="700x210" name="Body & Supporting" subtitle="Headline → footnote; web CJK bumps body to 14–15" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 22px 24px; }
  .row { display: grid; grid-template-columns: 1fr 150px; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--separator); }
  .row:last-child { border-bottom: none; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--label-3); text-align: right; }
  .hl { font-size: 13px; font-weight: 700; color: var(--label); }
  .bd { font-size: 13px; font-weight: 400; line-height: 1.7; color: var(--label); }
  .ca { font-size: 12px; color: var(--label-2); }
  .fn { font-size: 10px; color: var(--label-3); }
</style>
</head>
<body>
<div class="row"><span class="hl">智能体已完成技术需求解析，等待确认。</span><span class="meta">Headline · 13 / 700</span></div>
<div class="row"><span class="bd">投标人应当按照招标文件的要求编制投标文件，并对实质性要求和条件作出响应。</span><span class="meta">Body · 13 / 400 / 1.7</span></div>
<div class="row"><span class="ca">来源：仿真软件开发服务采购项目招标文件，第三章。</span><span class="meta">Callout · 12 / 400</span></div>
<div class="row"><span class="fn">最后保存于今天 14:02</span><span class="meta">Footnote · 10 / 400</span></div>
</body>
</html>
