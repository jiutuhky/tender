<!-- @dsCard group="Brand" viewport="700x230" name="Materials · Light" subtitle="Five optical layers — shadow, tint + lens, illumination, content, rim; light is state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 14px; background: var(--canvas); }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .stage { position: relative; height: 120px; border-radius: var(--r-card); background: var(--wallpaper); display: grid; place-items: center; overflow: hidden; }
  .paper { position: absolute; left: 8px; bottom: 6px; width: 58px; padding: 6px 7px; background: var(--surface); border-radius: 8px; box-shadow: var(--elev-1); font-size: 7px; font-weight: 600; color: var(--label); }
  .paper i { display: block; height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 4px; }
  .blob { position: absolute; right: 8px; top: 8px; width: 40px; height: 26px; border-radius: 8px; background: var(--blue); opacity: .75; }
  .sw { position: relative; width: 104px; height: 60px; border-radius: 12px; }
  .cap { margin-top: 7px; font-size: 11px; font-weight: 600; color: var(--label); }
  .cap small { display: block; font-weight: 400; color: var(--label-2); font-size: 9.5px; line-height: 1.45; }
  .sw-shadow { box-shadow: var(--glass-shadow-regular); }
  .sw-outline { box-shadow: 0 0 0 .5px rgba(16,24,40,.35); }
  .sw-warp { backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%); background: var(--glass-tint-lens); }
  html[data-warp="1"] .sw-warp { backdrop-filter: url(#frost-lens-regular); -webkit-backdrop-filter: url(#frost-lens-regular); filter: url(#frost-lens-noop); }
  .sw-illum { background: var(--glass-illum), radial-gradient(70px 50px at 30% 0%, rgb(255 255 255 / var(--glass-spot-alpha)), transparent 70%); }
  .sw-body { display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--label); }
  .sw-rim { box-shadow: inset 0 0 0 var(--glass-rim-w) var(--glass-rim-base), inset 1.5px 1.5px 0 -.5px var(--glass-rim-catch), inset -1.5px -1.5px 0 -.5px var(--glass-rim-echo); }
  .final { display: grid; place-items: center; height: 100%; font-size: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="row">
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw sw-shadow"></div></div><div class="cap">⑤ 投影<small>环境影 + 中层影 + 近影 + 全向晕 + .5px 接触环</small></div></div>
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw sw-warp sw-outline"></div></div><div class="cap">① 底色 + 折射<small>tint 6% · backdrop-filter: url(#lens)</small></div></div>
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw sw-illum sw-outline"></div></div><div class="cap">② 照明<small>固定顶光 28% + 指针镜面高光 34%</small></div></div>
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw sw-body sw-outline">项目概要</div></div><div class="cap">③ 内容<small>文字与控件，Frost 原色</small></div></div>
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw sw-rim"></div></div><div class="cap">④ 棱光<small>1px 环 + 左上迎光段 / 右下内反射段</small></div></div>
  <div><div class="stage"><div class="paper">3.2 性能<i></i><i></i></div><div class="blob"></div><div class="sw frost-glass frost-glass--lens frost-glass--interactive" style="border-radius:12px"><div class="final">项目概要</div></div></div><div class="cap">合成 · 凝 · 常<small>悬停看高光跟指针，按下变亮</small></div></div>
</div>
<script src="../assets/frost-lens.js"></script>
</body>
</html>
