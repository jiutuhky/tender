<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标书工作台画布</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  /* ===== Frost design-system tokens (inlined from the imported design) ===== */
  :root {
    /* neutral ramp */
    --canvas:#eef0f3; --surface:#ffffff; --surface-2:#f5f6f8;
    --label:#1d1d1f; --label-2:#55555e; --label-3:#6b6b76;
    --separator:rgba(60,60,67,.12);
    /* accent */
    --blue:#0064e1; --blue-press:#0052bc; --blue-soft:rgba(0,100,225,.10);
    /* semantic */
    --green:#34c759; --green-text:#1d8f45;
    --orange:#ff9500; --orange-text:#b25e00;
    --red:#ff3b30; --red-text:#d70015;
    /* type */
    --font-ui:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif;
    --font-mono:"SF Mono",ui-monospace,Menlo,monospace;
    /* elevation */
    --elev-1:0 1px 2px rgba(18,24,38,.10),0 0 0 .5px rgba(18,24,38,.07);
    --elev-2:0 10px 30px rgba(18,24,38,.12),0 2px 8px rgba(18,24,38,.06),0 0 0 .5px rgba(18,24,38,.05);
    --elev-3:0 28px 80px rgba(12,18,32,.26),0 8px 24px rgba(12,18,32,.12),0 0 0 .5px rgba(12,18,32,.10);
  }
  html,body{margin:0;background:var(--canvas);}
  *{box-sizing:border-box;}
  @keyframes cardPop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes drawerIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes scrimIn{from{opacity:0}to{opacity:1}}
  .wbInput::placeholder{color:var(--label-3);}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
</style>
</head>
<body>
<div id="root" style="font-family:var(--font-ui);color:var(--label);background:var(--canvas);"></div>

<script>
/* =========================================================================
   Tiny hyperscript -> real DOM helper.
   Mirrors React.createElement closely enough that the design's render code
   ports almost verbatim: h(tag, props, ...children).
   ========================================================================= */
const SVG_TAGS = new Set(['svg','path','circle','g','line','rect','defs','polyline','polygon']);
const SVG_NS = 'http://www.w3.org/2000/svg';
const UNITLESS = new Set(['opacity','flex','flexGrow','flexShrink','order','fontWeight','zIndex','lineHeight','fillOpacity','strokeOpacity','strokeWidth','zoom']);

function applyStyle(node, style){
  for (const k in style){
    let v = style[k];
    if (v == null) continue;
    if (typeof v === 'number' && !UNITLESS.has(k)) v = v + 'px';
    node.style[k] = v;
  }
}
function appendChildren(node, children){
  for (const c of children){
    if (c == null || c === false || c === true) continue;
    if (Array.isArray(c)){ appendChildren(node, c); continue; }
    if (c instanceof Node){ node.appendChild(c); continue; }
    node.appendChild(document.createTextNode(String(c)));
  }
}
function camelToKebab(s){ return s.replace(/[A-Z]/g, m => '-' + m.toLowerCase()); }

function h(tag, props, ...children){
  const isSvg = SVG_TAGS.has(tag);
  const node = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
  if (props){
    for (const key in props){
      const val = props[key];
      if (val == null || key === 'key') continue;
      if (key === 'style'){ applyStyle(node, val); continue; }
      if (key === 'className'){
        if (isSvg) node.setAttribute('class', val); else node.className = val;
        continue;
      }
      if (key.startsWith('on') && typeof val === 'function'){
        node.addEventListener(key.slice(2).toLowerCase(), val);
        continue;
      }
      node.setAttribute(isSvg ? camelToKebab(key) : key, val);
    }
  }
  appendChildren(node, children);
  return node;
}
function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }

/* =========================================================================
   Workbench logic — ported from the imported DCLogic component (canvas "B",
   the outline-spine "大纲星图" view that renderVals() selects).
   ========================================================================= */
class Workbench {
  constructor(){
    this.opt = 'B';
    this.uid = 1;
    this.props = { showConnections:true, showGrid:false, connectionStyle:'曲线' };

    this.META = {
      req:{title:'技术需求清单',icon:'list-dashes',stage:'解析',status:'已生成',sc:'green',w:218,h:170},
      knowledge:{title:'知识库素材',icon:'stack',stage:'素材',status:'引用 6 处',sc:'blue',w:222,h:184},
      matrix:{title:'应答矩阵',icon:'table',stage:'应答',status:'进行中',sc:'blue',w:250,h:200},
      deviation:{title:'技术偏差表',icon:'rows',stage:'应答',status:'草稿',sc:'gray',w:228,h:158},
      outline:{title:'投标大纲',icon:'tree-structure',stage:'大纲',status:'已生成',sc:'green',w:226,h:206},
      chapter:{title:'技术方案 · 总体设计',icon:'file-text',stage:'章节',status:'草稿',sc:'gray',w:260,h:208},
      chart:{title:'实施进度计划',icon:'chart-bar',stage:'章节',status:'已生成',sc:'green',w:238,h:166},
      assemble:{title:'投标文件 · 成稿',icon:'files',stage:'成稿',status:'编制中',sc:'blue',w:226,h:182}
    };
    this.spine = {x:556,y:58,w:206,headerH:44,rowH:30,nodes:[
      {t:'一  投标函与附录',s:'green',ind:0},
      {t:'二  商务及报价响应',s:'green',ind:0},
      {t:'三  技术方案',s:'blue',ind:0},
      {t:'3.1  总体技术架构',s:'gray',ind:1},
      {t:'3.2  技术需求逐条响应',s:'green',ind:1},
      {t:'3.3  技术偏差表',s:'gray',ind:1},
      {t:'四  项目实施与服务',s:'gray',ind:0},
      {t:'五  资质证明材料',s:'green',ind:0},
      {t:'六  拟投入人员',s:'gray',ind:0}
    ]};
    this.size = {w:1240,h:920};
    this.state = {
      view:{s:0.72,px:30,py:50},
      cards:this.initCards(),
      drawer:null
    };
    this.drag = null;
    this.onMove = this.onMove.bind(this);
    this.onUp = this.onUp.bind(this);
    window.addEventListener('mousemove', this.onMove);
    window.addEventListener('mouseup', this.onUp);
  }

  initCards(){
    const m = this.META;
    const mk = (type,x,y) => ({id:type,type,x,y,w:m[type].w,h:m[type].h});
    return [ mk('req',118,52), mk('matrix',104,288), mk('deviation',128,556),
             mk('chapter',912,68), mk('knowledge',912,298), mk('chart',912,512), mk('assemble',556,520) ];
  }

  /* ---- interaction ---- */
  startPan(e){
    this.drag = {type:'pan',sx:e.clientX,sy:e.clientY,ox:this.state.view.px,oy:this.state.view.py,moved:false};
    document.body.style.cursor = 'grabbing';
  }
  onCardDown(id,e){
    e.stopPropagation();
    const c = this.state.cards.find(c => c.id === id); if (!c) return;
    this.drag = {type:'card',id,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,moved:false};
    document.body.style.cursor = 'grabbing';
  }
  onMove(e){
    const d = this.drag; if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) d.moved = true;
    if (d.type === 'pan'){
      this.state.view.px = d.ox + dx;
      this.state.view.py = d.oy + dy;
    } else {
      const s = this.state.view.s;
      const c = this.state.cards.find(c => c.id === d.id);
      if (c){ c.x = d.ox + dx / s; c.y = d.oy + dy / s; c.isNew = false; }
    }
    this.renderWorld();
  }
  onUp(){
    const d = this.drag; this.drag = null; document.body.style.cursor = '';
    if (d && d.type === 'card' && !d.moved) this.openCard(d.id);
  }
  zoom(dz){
    const v = this.state.view;
    v.s = Math.min(1.4, Math.max(0.4, +(v.s + dz).toFixed(2)));
    this.renderWorld(); this.updateScale();
  }
  fit(){ this.state.view = {s:0.72,px:30,py:50}; this.renderWorld(); this.updateScale(); }
  reset(){
    this.state.view = {s:0.72,px:30,py:50};
    this.state.cards = this.initCards();
    this.state.drawer = null;
    this.renderWorld(); this.renderDrawer(); this.updateScale();
  }
  openCard(id){ this.state.drawer = {id}; this.renderDrawer(); }
  openOutline(){ this.state.drawer = {id:'__outline'}; this.renderDrawer(); }
  closeDrawer(){ this.state.drawer = null; this.renderDrawer(); }
  addArtifact(type,title){
    const m = this.META[type], v = this.state.view;
    const cx = (-v.px + 480) / v.s, cy = (-v.py + 150) / v.s + (this.uid * 8);
    const card = {id:type + '_' + (this.uid++),type,title,x:cx,y:cy,w:m.w,h:m.h,isNew:true};
    this.state.cards.push(card);
    this.state.drawer = {id:card.id};
    this.renderWorld(); this.renderDrawer();
  }

  /* ---- small helpers ---- */
  scPair(sc){ return ({green:['rgba(52,199,89,.15)','var(--green-text)'],blue:['var(--blue-soft)','var(--blue)'],gray:['rgba(60,60,67,.10)','var(--label-2)'],orange:['rgba(255,149,0,.15)','var(--orange-text)']})[sc] || ['rgba(60,60,67,.10)','var(--label-2)']; }
  dotColor(k){ return k === 'gray' ? 'var(--label-3)' : 'var(--' + k + ')'; }
  dot(k){ return h('span',{style:{width:8,height:8,borderRadius:999,background:this.dotColor(k),display:'inline-block',flex:'0 0 auto'}}); }
  iconTile(name){ return h('span',{style:{width:24,height:24,borderRadius:7,background:'var(--blue-soft)',color:'var(--blue)',display:'grid',placeItems:'center',fontSize:14,flex:'0 0 auto'}},h('i',{className:'ph ph-' + name})); }
  statusBadge(sc,label){ const [bg,fg] = this.scPair(sc); return h('span',{style:{display:'inline-flex',alignItems:'center',gap:5,fontSize:11,fontWeight:600,color:fg,background:bg,padding:'2px 8px',borderRadius:999,whiteSpace:'nowrap'}}, h('span',{style:{width:6,height:6,borderRadius:999,background:fg}}), label); }
  chip(t){ return h('span',{style:{fontSize:10,fontWeight:600,color:'var(--blue)',background:'var(--blue-soft)',padding:'2px 7px',borderRadius:999,whiteSpace:'nowrap'}},t); }

  /* ---- card preview bodies ---- */
  preview(type){
    if (type === 'req'){
      const cats = [['功能',18,.9],['性能',9,.5],['接口',7,.4],['安全',11,.62]];
      return h('div',{style:{display:'flex',flexDirection:'column',gap:7}},
        cats.map((k,i) => h('div',{key:i,style:{display:'flex',alignItems:'center',gap:8}},
          h('span',{style:{width:30,fontSize:11,color:'var(--label-2)'}},k[0]),
          h('div',{style:{flex:1,height:6,borderRadius:999,background:'var(--surface-2)',overflow:'hidden'}},h('div',{style:{width:(k[2]*100)+'%',height:'100%',background:'var(--blue)',borderRadius:999}})),
          h('span',{style:{width:18,textAlign:'right',fontSize:11,fontVariantNumeric:'tabular-nums',color:'var(--label-3)'}},k[1]))),
        h('div',{style:{marginTop:1,fontSize:11,color:'var(--label-3)'}},'实质性条款 ',h('b',{style:{color:'var(--orange-text)'}},'6'),' 项'));
    }
    if (type === 'matrix'){
      const rows = [['多物理场耦合','满足','green'],['1000万网格规模','满足','green'],['PLM 系统接口','部分','orange']];
      return h('div',null,
        h('div',{style:{display:'flex',fontSize:10.5,color:'var(--label-3)',paddingBottom:4}},h('span',{style:{flex:1}},'需求条目'),h('span',{style:{width:42}},'响应'),h('span',{style:{width:26,textAlign:'right'}},'偏离')),
        rows.map((r,i) => h('div',{key:i,style:{display:'flex',alignItems:'center',padding:'5px 0',borderTop:'1px solid var(--separator)',fontSize:11.5}},
          h('span',{style:{flex:1,color:'var(--label)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},r[0]),
          h('span',{style:{width:42,color:'var(--label-2)'}},r[1]),
          h('span',{style:{width:26,display:'flex',justifyContent:'flex-end'}},this.dot(r[2])))),
        h('div',{style:{marginTop:8,display:'flex',alignItems:'center',gap:7,fontSize:10.5,color:'var(--blue)'}},'生成 32 / 45',h('div',{style:{flex:1,height:4,borderRadius:999,background:'var(--surface-2)',overflow:'hidden'}},h('div',{style:{width:'71%',height:'100%',background:'var(--blue)'}}))));
    }
    if (type === 'outline'){
      const items = [['一  投标函与附录','green'],['二  商务及报价响应','green'],['三  技术方案','blue'],['四  项目实施与服务','gray'],['五  资质证明材料','green']];
      return h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
        items.map((it,i) => h('div',{key:i,style:{display:'flex',alignItems:'center',gap:8,fontSize:11.5,color:'var(--label)'}},this.dot(it[1]),h('span',{style:{flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},it[0]))),
        h('div',{style:{marginTop:1,fontSize:11,color:'var(--label-3)'}},'共 8 章 · 引用 12 处'));
    }
    if (type === 'chapter'){
      return h('div',null,
        h('div',{style:{fontSize:12,fontWeight:600,color:'var(--label)',marginBottom:7}},'3.1  总体技术架构'),
        [.94,.99,.72].map((w,i) => h('div',{key:i,style:{height:7,borderRadius:999,background:'var(--surface-2)',width:(w*100)+'%',marginBottom:6}})),
        h('div',{style:{display:'flex',gap:5,marginTop:4}},this.chip('业绩 A-203'),this.chip('ISO9001'),this.chip('+4')));
    }
    if (type === 'knowledge'){
      const rows = [['identification-card','资质证照',12],['buildings','业绩案例',8],['files','人员简历',15]];
      return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
        rows.map((r,i) => h('div',{key:i,style:{display:'flex',alignItems:'center',gap:9}},
          h('span',{style:{width:24,height:24,borderRadius:7,background:'var(--surface-2)',display:'grid',placeItems:'center',color:'var(--label-2)',fontSize:13}},h('i',{className:'ph ph-' + r[0]})),
          h('span',{style:{flex:1,fontSize:12,color:'var(--label)'}},r[1]),
          h('span',{style:{fontSize:11,fontWeight:600,fontVariantNumeric:'tabular-nums',color:'var(--green-text)',background:'rgba(52,199,89,.15)',padding:'1px 8px',borderRadius:999}},r[2]))));
    }
    if (type === 'chart'){
      const bars = [[0,.5,'blue'],[.18,.46,'blue'],[.4,.4,'green'],[.56,.42,'gray']];
      return h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
        bars.map((b,i) => h('div',{key:i,style:{height:8,borderRadius:999,background:'var(--surface-2)',position:'relative'}},
          h('div',{style:{position:'absolute',top:0,bottom:0,left:(b[0]*100)+'%',width:(b[1]*100)+'%',borderRadius:999,background:this.dotColor(b[2]),opacity:b[2]==='gray'?.45:.9}}))),
        h('div',{style:{fontSize:10.5,color:'var(--label-3)',marginTop:1}},'实施周期 6 个月 · 4 里程碑'));
    }
    if (type === 'deviation'){
      const rows = [['国产化适配','正偏离','blue'],['接口协议版本','负偏离','orange'],['响应时限','无偏离','green']];
      return h('div',null, rows.map((r,i) => h('div',{key:i,style:{display:'flex',alignItems:'center',gap:8,padding:'6px 0',borderTop:i?'1px solid var(--separator)':'none',fontSize:11.5}},
        h('span',{style:{flex:1,color:'var(--label)'}},r[0]),this.dot(r[2]),h('span',{style:{fontSize:11,color:'var(--label-2)'}},r[1]))));
    }
    if (type === 'assemble'){
      return h('div',null,
        h('div',{style:{display:'flex',alignItems:'baseline',gap:7,marginBottom:8}},h('span',{style:{fontSize:24,fontWeight:700,color:'var(--label)',fontVariantNumeric:'tabular-nums'}},'33%'),h('span',{style:{fontSize:11,color:'var(--label-3)'}},'4 / 12 章已编制')),
        h('div',{style:{height:6,borderRadius:999,background:'var(--surface-2)',overflow:'hidden',marginBottom:9}},h('div',{style:{width:'33%',height:'100%',background:'var(--blue)'}})),
        h('div',{style:{fontSize:11,color:'var(--label-2)'}},'约 1.2 万字 · 待补 资质附件 与 报价表'));
    }
    return null;
  }

  /* ---- card ---- */
  buildCard(c){
    const m = this.META[c.type];
    const inProg = m.status === '进行中';
    return h('div',{key:c.id, onMouseDown:(e) => this.onCardDown(c.id,e),
      style:{position:'absolute',left:c.x,top:c.y,width:c.w,background:'var(--surface)',borderRadius:14,boxShadow:'var(--elev-2)',overflow:'hidden',cursor:'grab',userSelect:'none',animation:c.isNew?'cardPop .32s cubic-bezier(.32,.72,0,1)':undefined}},
      inProg?h('div',{style:{height:3,background:'linear-gradient(90deg,var(--blue) 71%,var(--surface-2) 71%)'}}):null,
      h('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'10px 12px',borderBottom:'1px solid var(--separator)'}},
        this.iconTile(m.icon),
        h('span',{style:{flex:1,fontSize:12.5,fontWeight:600,color:'var(--label)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},c.title || m.title),
        h('span',{style:{fontSize:10.5,fontWeight:600,color:'var(--label-3)',background:'var(--surface-2)',padding:'2px 7px',borderRadius:999,whiteSpace:'nowrap'}},m.stage)),
      h('div',{style:{padding:'11px 12px'}}, this.preview(c.type)),
      h('div',{style:{display:'flex',alignItems:'center',padding:'8px 12px',borderTop:'1px solid var(--separator)'}},
        this.statusBadge(m.sc,m.status),
        h('span',{style:{marginLeft:'auto',fontSize:11,color:'var(--label-3)',display:'inline-flex',alignItems:'center',gap:3}},'展开',h('i',{className:'ph ph-arrow-right'}))));
  }

  /* ---- background spine ---- */
  spineNodeY(i){ const s = this.spine; return s.y + s.headerH + i*s.rowH + s.rowH/2; }
  bgB(){
    const s = this.spine;
    return h('div',{onMouseDown:(e) => e.stopPropagation(),style:{position:'absolute',left:s.x,top:s.y,width:s.w,background:'var(--surface)',borderRadius:16,boxShadow:'var(--elev-2)',overflow:'hidden'}},
      h('div',{style:{height:s.headerH,display:'flex',alignItems:'center',gap:8,padding:'0 13px',borderBottom:'1px solid var(--separator)',background:'rgba(0,100,225,.04)'}},
        h('i',{className:'ph ph-tree-structure',style:{color:'var(--blue)',fontSize:15}}),
        h('span',{style:{fontSize:13,fontWeight:700,color:'var(--label)'}},'投标文件大纲'),
        h('span',{style:{marginLeft:'auto',fontSize:10.5,fontWeight:600,color:'var(--blue)',background:'var(--blue-soft)',padding:'1px 7px',borderRadius:999}},'主轴')),
      s.nodes.map((n,i) => h('div',{key:i,onClick:() => this.openOutline(),style:{height:s.rowH,display:'flex',alignItems:'center',gap:8,padding:'0 13px',paddingLeft:13+n.ind*16,cursor:'pointer',background:n.s==='blue'?'var(--blue-soft)':'transparent',fontSize:n.ind?11:12,fontWeight:n.s==='blue'?700:(n.ind?400:600),color:n.ind?'var(--label-2)':'var(--label)'}},
        this.dot(n.s),h('span',{style:{flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},n.t))));
  }

  /* ---- links ---- */
  pathD(sx,sy,tx,ty,ortho){
    if (ortho){ const mx = (sx+tx)/2; return 'M '+sx+' '+sy+' L '+mx+' '+sy+' L '+mx+' '+ty+' L '+tx+' '+ty; }
    const co = Math.max(40, Math.abs(tx-sx)*0.45);
    return 'M '+sx+' '+sy+' C '+(sx+co)+' '+sy+', '+(tx-co)+' '+ty+', '+tx+' '+ty;
  }
  linkSvg(segs,w,ht,ortho){
    const paths = [], dots = [];
    segs.forEach((g,i) => {
      paths.push(h('path',{key:'p'+i,d:this.pathD(g.sx,g.sy,g.tx,g.ty,ortho&&!g.v),fill:'none',stroke:'var(--blue)',strokeWidth:1.6,strokeOpacity:.45,strokeLinecap:'round'}));
      dots.push(h('circle',{key:'a'+i,cx:g.sx,cy:g.sy,r:3,fill:'var(--blue)',fillOpacity:.7}));
      dots.push(h('circle',{key:'b'+i,cx:g.tx,cy:g.ty,r:3,fill:'var(--blue)',fillOpacity:.7}));
    });
    return h('svg',{width:w,height:ht,style:{position:'absolute',left:0,top:0,overflow:'visible',pointerEvents:'none'}},paths,dots);
  }
  linksB(cards,ortho){
    const by = {}; cards.forEach(c => by[c.id] = c);
    const s = this.spine;
    const defs = [{a:'req',n:4},{a:'matrix',n:4},{a:'deviation',n:5},{a:'chapter',n:3},{a:'knowledge',n:7},{a:'chart',n:6}];
    const segs = [];
    defs.forEach(d => { const c = by[d.a]; if (!c) return; const ny = this.spineNodeY(d.n);
      if (c.x < s.x){ segs.push({sx:c.x+c.w,sy:c.y+c.h/2,tx:s.x,ty:ny}); }
      else { segs.push({sx:s.x+s.w,sy:ny,tx:c.x,ty:c.y+c.h/2}); } });
    const asm = by['assemble']; if (asm){ const spineBottom = s.y + s.headerH + s.nodes.length*s.rowH; segs.push({v:true,sx:s.x+s.w/2,sy:spineBottom,tx:asm.x+asm.w/2,ty:asm.y}); }
    return this.linkSvg(segs,1240,920,ortho);
  }

  /* ---- drawer detail ---- */

          h('span',{style:{fontSize:11,color:'var(--green-text)',display:'inline-flex',alignItems:'center',gap:5}},h('span',{style:{width:6,height:6,borderRadius:999,background:'var(--green)'}}),'在线 · 已连接知识库'))),
      h('div',{style:{flex:1,minHeight:0}}, this.chatEl()),
      h('div',{style:{padding:'10px 16px 16px',borderTop:'1px solid var(--separator)'}},
        h('div',{style:{border:'1px solid var(--separator)',borderRadius:14,background:'var(--surface)',boxShadow:'var(--elev-1)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:10}},
          h('input',{className:'wbInput',type:'text',placeholder:'向标书智能体描述下一步…',style:{border:'none',outline:'none',background:'transparent',font:'inherit',fontSize:13,color:'var(--label)'}}),
          h('div',{style:{display:'flex',alignItems:'center',gap:8}},
            h('button',{style:{display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 11px',border:'1px solid var(--separator)',background:'var(--surface)',borderRadius:8,font:'inherit',fontSize:12,color:'var(--label-2)',cursor:'pointer'}},h('i',{className:'ph ph-paperclip'}),'上传'),
            h('button',{style:{display:'inline-flex',alignItems:'center',gap:6,height:30,padding:'0 11px',border:'1px solid var(--separator)',background:'var(--surface)',borderRadius:8,font:'inherit',fontSize:12,color:'var(--label-2)',cursor:'pointer'}},h('i',{className:'ph ph-list-dashes'}),'样本'),
            h('span',{style:{flex:1}}),
            h('button',{'aria-label':'发送',style:{width:34,height:34,border:'none',borderRadius:'50%',display:'grid',placeItems:'center',color:'#fff',fontSize:15,background:'linear-gradient(180deg,#1979f2,var(--blue))',boxShadow:'0 1px 3px rgba(0,80,200,.4),inset 0 1px 0 rgba(255,255,255,.3)',cursor:'pointer'}},h('i',{className:'ph ph-paper-plane-tilt'}))))));

    /* canvas toolbar */
    this.scaleLabelEl = h('span',{style:{fontSize:12,fontVariantNumeric:'tabular-nums',color:'var(--label)',minWidth:40,textAlign:'center'}},Math.round(this.state.view.s*100)+'%');
    const toolbar = h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:'1px solid var(--separator)',background:'rgba(245,246,248,.8)',backdropFilter:'blur(40px)',WebkitBackdropFilter:'blur(40px)',zIndex:6}},
      h('span',{style:{display:'inline-flex',alignItems:'center',gap:7,fontSize:13,fontWeight:600,color:'var(--label)'}},h('i',{className:'ph ph-squares-four',style:{color:'var(--blue)',fontSize:15}}),'大纲视图'),
      h('span',{style:{fontSize:12,color:'var(--label-3)'}},'招标文件解析结果 · 工作进行中'),
      h('span',{style:{flex:1}}),
      h('span',{style:{display:'inline-flex',alignItems:'center',gap:2,background:'var(--surface)',border:'1px solid var(--separator)',borderRadius:9,padding:2,boxShadow:'var(--elev-1)'}},
        h('button',{'aria-label':'缩小',onClick:() => this.zoom(-0.1),style:{width:28,height:28,border:'none',background:'transparent',color:'var(--label-2)',borderRadius:7,display:'grid',placeItems:'center',fontSize:15,cursor:'pointer'}},h('i',{className:'ph ph-minus'})),
        this.scaleLabelEl,
        h('button',{'aria-label':'放大',onClick:() => this.zoom(0.1),style:{width:28,height:28,border:'none',background:'transparent',color:'var(--label-2)',borderRadius:7,display:'grid',placeItems:'center',fontSize:15,cursor:'pointer'}},h('i',{className:'ph ph-plus'}))),
      h('button',{'aria-label':'适应画布',onClick:() => this.fit(),style:{width:32,height:32,border:'1px solid var(--separator)',background:'var(--surface)',color:'var(--label-2)',borderRadius:8,display:'grid',placeItems:'center',fontSize:15,cursor:'pointer',boxShadow:'var(--elev-1)'}},h('i',{className:'ph ph-corners-out'})),
      h('button',{'aria-label':'重置画布',onClick:() => this.reset(),style:{width:32,height:32,border:'1px solid var(--separator)',background:'var(--surface)',color:'var(--label-2)',borderRadius:8,display:'grid',placeItems:'center',fontSize:15,cursor:'pointer',boxShadow:'var(--elev-1)'}},h('i',{className:'ph ph-arrow-counter-clockwise'})));

    /* viewport */
    this.worldEl = h('div',{style:{position:'absolute',left:0,top:0,width:this.size.w,height:this.size.h,transformOrigin:'0 0'}});
    this.drawerHost = h('div');
    const chips = h('div',{style:{display:'flex',gap:8,pointerEvents:'auto'}},
      h('button',{onClick:() => this.addArtifact('matrix','应答矩阵 · 补充'),style:{display:'inline-flex',alignItems:'center',gap:6,height:32,padding:'0 13px',border:'1px solid var(--separator)',background:'var(--surface)',borderRadius:9,font:'inherit',fontSize:12.5,fontWeight:600,color:'var(--label)',cursor:'pointer',boxShadow:'var(--elev-1)'}},h('i',{className:'ph ph-table',style:{color:'var(--blue)'}}),'合成应答矩阵'),
      h('button',{onClick:() => this.addArtifact('outline','投标大纲 · 备选'),style:{display:'inline-flex',alignItems:'center',gap:6,height:32,padding:'0 13px',border:'1px solid var(--separator)',background:'var(--surface)',borderRadius:9,font:'inherit',fontSize:12.5,fontWeight:600,color:'var(--label)',cursor:'pointer',boxShadow:'var(--elev-1)'}},h('i',{className:'ph ph-tree-structure',style:{color:'var(--blue)'}}),'生成大纲'),
      h('button',{onClick:() => this.addArtifact('chapter','技术方案 · 性能指标'),style:{display:'inline-flex',alignItems:'center',gap:6,height:32,padding:'0 13px',border:'1px solid var(--separator)',background:'var(--surface)',borderRadius:9,font:'inherit',fontSize:12.5,fontWeight:600,color:'var(--label)',cursor:'pointer',boxShadow:'var(--elev-1)'}},h('i',{className:'ph ph-pencil-simple-line',style:{color:'var(--blue)'}}),'起草章节'));
    const composer = h('div',{style:{pointerEvents:'auto',display:'flex',alignItems:'center',gap:10,width:'min(680px,86%)',background:'var(--surface)',border:'1px solid var(--separator)',borderRadius:16,boxShadow:'0 12px 30px rgba(12,18,32,.16),0 0 0 .5px rgba(12,18,32,.06)',padding:'8px 8px 8px 14px'}},
      h('span',{style:{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,fontWeight:600,color:'var(--blue)',background:'var(--blue-soft)',padding:'5px 10px',borderRadius:9,whiteSpace:'nowrap'}},h('i',{className:'ph ph-sparkle'}),'标书智能体'),
      h('input',{className:'wbInput',type:'text',placeholder:'描述你想要的制品，智能体会生成到画布…',style:{border:'none',outline:'none',background:'transparent',flex:1,font:'inherit',fontSize:13.5,color:'var(--label)'}}),
      h('button',{'aria-label':'生成',style:{width:36,height:36,border:'none',borderRadius:11,display:'grid',placeItems:'center',color:'#fff',fontSize:16,background:'linear-gradient(180deg,#1979f2,var(--blue))',boxShadow:'0 1px 3px rgba(0,80,200,.4),inset 0 1px 0 rgba(255,255,255,.3)',cursor:'pointer'}},h('i',{className:'ph ph-arrow-up'})));
    const floating = h('div',{onMouseDown:(e) => e.stopPropagation(),style:{position:'absolute',left:0,right:0,bottom:18,display:'flex',flexDirection:'column',alignItems:'center',gap:10,zIndex:8,pointerEvents:'none'}}, chips, composer);
    const viewport = h('div',{onMouseDown:(e) => this.startPan(e),style:{position:'relative',flex:1,minHeight:0,overflow:'hidden',cursor:'grab'}}, this.worldEl, floating, this.drawerHost);

    const canvasRegion = h('div',{style:{position:'relative',display:'flex',flexDirection:'column',minHeight:0,background:'var(--surface-2)'}}, toolbar, viewport);
    const body = h('div',{style:{display:'grid',gridTemplateColumns:'368px 1fr',minHeight:0}}, chatCol, canvasRegion);
    const frame = h('div',{style:{width:'100vw',height:'100vh',overflow:'hidden',background:'var(--surface)',display:'grid',gridTemplateRows:'56px 1fr'}}, topbar, body);

    const root = document.getElementById('root');
    clear(root);
    root.appendChild(frame);
  }

  /* ---- dynamic renders ---- */
  renderWorld(){
    const v = this.state.view;
    this.worldEl.style.transform = 'translate('+v.px+'px,'+v.py+'px) scale('+v.s+')';
    this.worldEl.style.backgroundImage = this.props.showGrid ? 'radial-gradient(circle, rgba(60,60,67,.16) 1px, transparent 1px)' : 'none';
    this.worldEl.style.backgroundSize = '24px 24px';
    clear(this.worldEl);
    const ortho = (this.props.connectionStyle || '曲线') === '直角';
    this.worldEl.appendChild(this.bgB());
    if (this.props.showConnections !== false) this.worldEl.appendChild(this.linksB(this.state.cards, ortho));
    this.state.cards.forEach(c => this.worldEl.appendChild(this.buildCard(c)));
  }
  renderDrawer(){ clear(this.drawerHost); const d = this.drawerEl(); if (d) this.drawerHost.appendChild(d); }
  updateScale(){ this.scaleLabelEl.textContent = Math.round(this.state.view.s*100)+'%'; }

  mount(){ this.buildChrome(); this.renderWorld(); this.renderDrawer(); }
}

new Workbench().mount();
</script>
</body>
</html>
