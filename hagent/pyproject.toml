[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hagent"
version = "0.0.1"
description = "Hagent — Web-based agent harness built on deepagents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hankeyang" }]
license = { text = "Apache-2.0" }
dependencies = [
    "deepagents>=0.5.4",
    "langchain-anthropic>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "docker>=7.1",
    # MCP 工具面(结构化资产 spec §5–§6):FastMCP + Streamable HTTP/stdio 双 transport
    "mcp>=1.28",
    # agent 侧真 MCP client(票 04):prose_* MCP 工具 → langchain tools
    "langchain-mcp-adapters>=0.3",
    # 锁死:0.0.x API 演进剧烈,升级走显式任务并重跑 smolvm 门控测试(spec D1)
    "smolvm==0.0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "tiktoken>=0.7",
    "httpx>=0.27",
]

[project.scripts]
hagent = "hagent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "docker: requires a running docker daemon (HAGENT_TEST_DOCKER=1)",
    "gvisor: requires docker + runsc installed (HAGENT_TEST_GVISOR=1)",
    "smolvm: requires KVM + firecracker + smolvm setup (HAGENT_TEST_SMOLVM=1)",
    "e2e: requires ANTHROPIC_API_KEY",
]
