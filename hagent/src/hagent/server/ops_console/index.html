<!doctype html>
<html lang="zh-CN" data-appearance="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SmolVM 运维台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.2' fill='%231670ec'/%3E%3Crect x='8' y='9' width='16' height='4' rx='1.6' fill='%23ffffff' opacity='.55'/%3E%3Crect x='8' y='14.5' width='16' height='4' rx='1.6' fill='%23ffffff' opacity='.78'/%3E%3Crect x='8' y='20' width='16' height='4' rx='1.6' fill='%23ffffff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<style>
  /* SmolVM 运维台 — 对齐 Prose · Frost(霜)设计系统:冷灰中性 + 单一系统蓝、
     玻璃材质做层级、深度代替描边、连续圆角、系统字体栈(零文本 Web 字体)。
     Frost token 内联以保持单文件自包含;图标用 Phosphor(regular),缺网优雅降级。
     设计稿:docs/ops-console-design.md */
  :root {
    --canvas: #eef0f3; --surface: #fff; --surface-2: #f5f6f8;
    --label: #1d1d1f; --label-2: #55555e; --label-3: #6b6b76;
    --separator: rgba(60,60,67,.12);
    --blue: #0064e1; --blue-press: #0052bc; --blue-soft: rgba(0,100,225,.10);
    --green: #34c759; --green-text: #1d8f45;
    --orange: #ff9500; --orange-text: #b25e00;
    --red: #ff3b30; --red-text: #d70015;
    --wallpaper:
      radial-gradient(1100px 700px at 12% -10%, #c8e6ff 0%, rgba(200,230,255,0) 58%),
      radial-gradient(900px 620px at 92% 6%, #8fc0f5 0%, rgba(143,192,245,0) 55%),
      radial-gradient(1100px 850px at 78% 100%, #0a4ecf 0%, rgba(10,78,207,0) 62%),
      radial-gradient(820px 640px at 14% 86%, #2e8fd8 0%, rgba(46,143,216,0) 58%),
      linear-gradient(162deg, #d4e8fb 0%, #6aa4e6 46%, #1c4796 100%);
    --mat-toolbar-bg: rgba(255,255,255,.68); --mat-toolbar-blur: 40px;
    --mat-popover-bg: rgba(255,255,255,.75);
    --mat-border: 1px solid rgba(255,255,255,.45);
    --elev-1: 0 1px 2px rgba(18,24,38,.10), 0 0 0 .5px rgba(18,24,38,.07);
    --elev-2: 0 10px 30px rgba(18,24,38,.12), 0 2px 8px rgba(18,24,38,.06), 0 0 0 .5px rgba(18,24,38,.05);
    --highlight-top: inset 0 1px 0 rgba(255,255,255,.55);
    --r-control: 7px; --r-field: 9px; --r-window: 12px; --r-card: 14px; --r-panel: 18px;
    --font-ui: "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans SC",system-ui,sans-serif;
    --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.32,.72,0,1);
  }
  [data-appearance="dark"] {
    --canvas: #161618; --surface: #1e1e22; --surface-2: #2a2a30;
    --label: #f5f5f7; --label-2: #a8a8b3; --label-3: #6e6e78;
    --separator: rgba(255,255,255,.10);
    --blue: #409cff; --blue-press: #1f7fe0; --blue-soft: rgba(64,156,255,.16);
    --green-text: #40d869; --orange-text: #f0a53a; --red-text: #ff6961;
    --mat-toolbar-bg: rgba(34,34,40,.72); --mat-popover-bg: rgba(40,40,46,.80);
    --mat-border: 1px solid rgba(255,255,255,.10);
    --elev-1: 0 1px 2px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.06);
    --elev-2: 0 10px 30px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.06);
    --highlight-top: inset 0 1px 0 rgba(255,255,255,.08);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    color: var(--label); background: var(--canvas);
    font-family: var(--font-ui); font-size: 13.5px; line-height: 1.5;
    letter-spacing: -.008em; -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  [data-appearance="light"] body {
    background: var(--wallpaper) fixed;
    background-color: var(--canvas);
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 24px 28px 72px; }
  a { color: var(--blue); text-decoration: none; }
  .mono { font-family: var(--font-mono); }
  .dim { color: var(--label-2); } .faint { color: var(--label-3); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* 顶栏:玻璃工具栏(唯一半透明层,承 wallpaper) */
  header {
    position: sticky; top: 0; z-index: 30;
    background: var(--mat-toolbar-bg);
    backdrop-filter: blur(var(--mat-toolbar-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--mat-toolbar-blur)) saturate(180%);
    border-bottom: var(--separator) solid 1px;
    box-shadow: var(--highlight-top);
  }
  @media (prefers-reduced-transparency: reduce) {
    header { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  .bar { max-width: 1360px; margin: 0 auto; padding: 10px 28px; min-height: 52px;
         display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; letter-spacing: -.014em; }
  .brand .mark { width: 22px; height: 22px; border-radius: 22.4%;
    background: linear-gradient(135deg, #5fb0ff, #1670ec 55%, #0a3fa8);
    box-shadow: var(--elev-1); flex: none; position: relative; }
  .brand .mark::before, .brand .mark::after, .brand .mark span {
    content: ""; position: absolute; left: 26%; right: 26%; height: 2.4px; border-radius: 2px; background: #fff; }
  .brand .mark::before { top: 30%; opacity: .55; }
  .brand .mark span { top: 47%; opacity: .8; }
  .brand .mark::after { top: 64%; }
  .spacer { flex: 1 1 auto; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; background: var(--surface); box-shadow: var(--elev-1);
    font-size: 12px; color: var(--label-2);
  }
  .chip .k { color: var(--label-3); } .chip .v { color: var(--label); font-family: var(--font-mono); }
  .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--label-3); flex: none; }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--orange); } .dot.bad { background: var(--red); }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-field); padding: 2px; box-shadow: inset 0 0 0 .5px var(--separator); }
  .seg button {
    border: 0; background: transparent; color: var(--label-2); cursor: pointer;
    font-family: var(--font-ui); font-size: 12px; padding: 5px 11px; border-radius: var(--r-control);
    transition: color .12s var(--ease); font-variant-numeric: tabular-nums;
  }
  .seg button[aria-pressed="true"] { background: var(--blue); color: #fff; font-weight: 600; box-shadow: var(--elev-1), inset 0 1px 0 rgba(255,255,255,.28); }
  .seg button:active { transform: scale(.97); }
  .btn {
    border: 0; background: var(--surface); color: var(--label); box-shadow: var(--elev-1);
    border-radius: var(--r-control); padding: 6px 13px; cursor: pointer; font-family: var(--font-ui); font-size: 12.5px;
    transition: background .12s var(--ease), transform .12s var(--ease); display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: var(--elev-1), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn.primary:hover { background: var(--blue-press); }
  .btn i { font-size: 15px; }

  /* 错误条(玻璃 popover 语气,红色语义环) */
  .errbar {
    display: none; align-items: center; gap: 12px; margin: 20px 0 0;
    background: var(--surface); box-shadow: var(--elev-1), 0 0 0 1px rgba(255,59,48,.35);
    color: var(--red-text); border-radius: var(--r-card); padding: 11px 15px; font-size: 13px;
  }
  .errbar.show { display: flex; }
  .errbar i { font-size: 17px; }

  /* 连接设置 */
  .settings { display: none; gap: 16px; flex-wrap: wrap; align-items: flex-end;
    background: var(--surface); box-shadow: var(--elev-1); border-radius: var(--r-panel); padding: 18px 20px; margin-top: 20px; }
  .settings.show { display: flex; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11.5px; color: var(--label-2); }
  .field input {
    background: var(--surface-2); border: 0; box-shadow: inset 0 0 0 1px var(--separator); color: var(--label);
    border-radius: var(--r-field); height: 36px; padding: 0 12px; font-family: var(--font-mono); font-size: 12.5px; min-width: 280px;
  }
  .field input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--blue); }

  h2 { font-size: 13px; font-weight: 700; color: var(--label-2); margin: 30px 0 13px; letter-spacing: -.008em; }
  h2 .hint { font-weight: 400; color: var(--label-3); font-size: 12px; }

  /* KPI:每块独立实心卡(深度分隔,非描边) */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .kpi { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: 15px 16px; min-height: 92px; }
  .kpi .k-label { font-size: 12px; color: var(--label-2); display: flex; align-items: center; gap: 6px; }
  .kpi .k-val { font-family: var(--font-mono); font-size: 27px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 8px; line-height: 1; }
  .kpi .k-sub { font-size: 11.5px; color: var(--label-3); margin-top: 8px; font-family: var(--font-mono); }
  .k-ok { color: var(--green-text); } .k-warn { color: var(--orange-text); } .k-bad { color: var(--red-text); }

  .cols { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; align-items: start; }
  .panel { background: var(--surface); border-radius: var(--r-panel); box-shadow: var(--elev-1); padding: 18px 20px; }
  .panel.tight { padding: 8px 10px; }

  .gauge { margin: 6px 0 16px; }
  .gauge:last-child { margin-bottom: 6px; }
  .g-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 8px; }
  .g-top .g-val { font-family: var(--font-mono); color: var(--label-2); }
  .track { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; box-shadow: inset 0 0 0 .5px var(--separator); }
  .fill { height: 100%; border-radius: 999px; transition: width .32s var(--ease); }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
  .quota { font-size: 11.5px; color: var(--label-3); font-family: var(--font-mono); margin-top: 2px; }

  .dist-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 2px; border-bottom: 1px solid var(--separator); }
  .dist-row:last-child { border-bottom: 0; }
  .dist-row .num { font-size: 16px; }

  /* 表:行以 hairline 分隔,区域靠面板深度 */
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11.5px; color: var(--label-3); font-weight: 600; padding: 9px 12px;
    border-bottom: 1px solid var(--separator); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th.r { text-align: right; }
  thead th .arrow { color: var(--blue); }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--separator); font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .12s var(--ease); }
  tbody tr:hover { background: var(--surface-2); }
  td.r { text-align: right; }
  td .zh { font-family: var(--font-ui); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 8px; border-radius: 999px;
    font-size: 11.5px; font-family: var(--font-ui); background: var(--surface-2); color: var(--label-2); }
  .badge .dot { width: 7px; height: 7px; }
  .badge.ok { background: rgba(52,199,89,.12); color: var(--green-text); }
  .badge.warn { background: rgba(255,149,0,.13); color: var(--orange-text); }
  .badge.bad { background: rgba(255,59,48,.12); color: var(--red-text); }
  .badge.prog { background: var(--blue-soft); color: var(--blue); }
  .yes { color: var(--green-text); } .no { color: var(--red-text); }

  /* 事件流 */
  .feed-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .feed-head label { font-weight: 400; color: var(--label-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .ev { display: grid; grid-template-columns: 86px 118px 168px 1fr; gap: 14px; padding: 8px 12px;
    border-bottom: 1px solid var(--separator); font-size: 12.5px; align-items: baseline; }
  .ev:last-child { border-bottom: 0; }
  .ev:hover { background: var(--surface-2); }
  .ev .ev-t { color: var(--label-3); font-family: var(--font-mono); }
  .ev .ev-k { font-weight: 600; }
  .ev .ev-vm { color: var(--label-2); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
  .ev .ev-d { color: var(--label-2); }
  .ev.sev-bad .ev-k { color: var(--red-text); }
  .ev.sev-warn .ev-k { color: var(--orange-text); }
  .ev.sev-ok .ev-k { color: var(--green-text); }
  .ev.sev-info .ev-k { color: var(--label-3); }
  @media (prefers-reduced-motion: no-preference) { .ev.fresh { animation: enter .2s var(--ease); } }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  input[type="checkbox"] { accent-color: var(--blue); width: 15px; height: 15px; }

  .flash { animation: none; }
  @media (prefers-reduced-motion: no-preference) { .flash.go { animation: flash .2s var(--ease); } }
  @keyframes flash { from { opacity: .35; } to { opacity: 1; } }

  .sk { background: var(--surface-2); border-radius: 6px; height: 14px; }
  .empty { color: var(--label-3); text-align: center; padding: 34px 12px; font-size: 13px; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .ev { grid-template-columns: 72px 1fr; }
    .ev .ev-vm, .ev .ev-d { display: none; }
    .table-scroll { overflow-x: auto; }
    .wrap { padding: 20px 16px 56px; }
    .bar { padding: 10px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand"><span class="mark"><span></span></span>SmolVM 运维台</span>
    <span class="chip"><span class="k">沙箱后端</span><span class="v" id="provider">-</span></span>
    <span class="chip" id="livePill"><span class="dot" id="liveDot"></span><span id="liveText">连接中</span></span>
    <span class="chip"><span class="k">更新于</span><span class="v flash" id="updated">-</span></span>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="刷新频率">
      <button data-ms="2000" aria-pressed="false">2秒</button>
      <button data-ms="5000" aria-pressed="true">5秒</button>
      <button data-ms="15000" aria-pressed="false">15秒</button>
      <button data-ms="0" aria-pressed="false">暂停</button>
    </div>
    <button class="btn" id="appearanceBtn" title="切换外观"><i class="ph ph-moon" id="appIcon"></i></button>
    <button class="btn" id="settingsBtn"><i class="ph ph-plugs"></i>连接设置</button>
  </div>
</header>

<div class="wrap">
  <div class="errbar" id="errbar">
    <i class="ph ph-warning-circle"></i>
    <span id="errmsg"></span>
    <span class="spacer"></span>
    <button class="btn" id="retryBtn">重试</button>
  </div>

  <div class="settings" id="settings">
    <div class="field">
      <label for="apiBase">API 地址(留空 = 同源)</label>
      <input id="apiBase" placeholder="http://localhost:8000" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label for="apiKey">API 密钥(HAGENT_API_KEY,开发环境可留空)</label>
      <input id="apiKey" type="password" placeholder="Bearer 令牌" autocomplete="off" spellcheck="false" />
    </div>
    <button class="btn primary" id="saveBtn"><i class="ph ph-check"></i>保存并重连</button>
  </div>

  <h2>机群健康</h2>
  <section class="kpis" id="kpis" aria-live="polite"></section>

  <div class="cols">
    <div>
      <h2>容量准入 <span class="hint">内存不超卖</span></h2>
      <div class="panel" id="capacity"></div>
    </div>
    <div>
      <h2>会话状态分布</h2>
      <div class="panel" id="dist"></div>
    </div>
  </div>

  <h2>沙箱机群</h2>
  <div class="panel tight table-scroll">
    <table id="fleet">
      <thead><tr>
        <th data-k="project_id">项目</th>
        <th data-k="vm_id">虚拟机</th>
        <th data-k="state">状态</th>
        <th data-k="node">节点</th>
        <th data-k="pid">进程</th>
        <th data-k="rss_mib" class="r">内存 (MiB)</th>
        <th data-k="cpu_seconds" class="r">CPU (秒)</th>
        <th data-k="idle_seconds" class="r">空闲 (秒)</th>
        <th data-k="snapshot_id">快照</th>
      </tr></thead>
      <tbody id="fleetBody"></tbody>
    </table>
  </div>

  <h2 class="feed-head">
    事件流
    <label><input type="checkbox" id="showMetrics" /> 含指标采样</label>
  </h2>
  <div class="panel tight"><div id="feed"></div></div>
</div>

<script>
(function () {
  "use strict";
  var LS = { base: "hagent_ops_base", key: "hagent_ops_key", app: "hagent_ops_appearance" };
  var STATE_ZH = {
    creating: "创建中", running: "运行中", paused: "已暂停", snapshotted: "已休眠",
    orphaned: "已失联", evicted: "已驱逐", error: "错误", closed: "已关闭",
    unknown: "未知", "unmatched-vm": "游离虚拟机",
  };
  var STATE_KIND = {
    running: "ok", creating: "prog", paused: "warn", snapshotted: "",
    orphaned: "bad", error: "bad", evicted: "", closed: "", "unmatched-vm": "warn", unknown: "",
  };
  var EVENT_ZH = {
    created: "已创建", adopted: "已收养", paused: "已暂停", resumed: "已恢复运行",
    evicted: "已驱逐", orphaned: "已失联", health_fail: "健康失败", reaped: "已清场",
    create_failed: "创建失败", metrics: "指标采样", snapshotted: "已休眠",
    restored: "已恢复", restore_failed: "恢复失败",
  };
  var SEV = {
    health_fail: "bad", create_failed: "bad", restore_failed: "bad", orphaned: "bad",
    created: "ok", adopted: "ok", restored: "ok", resumed: "ok",
    evicted: "warn", reaped: "warn", snapshotted: "warn", paused: "warn", metrics: "info",
  };
  var state = { intervalMs: 5000, timer: null, lastIds: new Set(), showMetrics: false,
                sort: { key: "state", dir: 1 }, firstLoad: true };
  var $ = function (id) { return document.getElementById(id); };
  function base() { return (localStorage.getItem(LS.base) || "").replace(/\/+$/, ""); }
  function key() { return localStorage.getItem(LS.key) || ""; }
  function headers() { var h = {}; var k = key(); if (k) h.Authorization = "Bearer " + k; return h; }
  async function getJSON(path) {
    var r = await fetch(base() + path, { headers: headers(), cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
    return r.json();
  }
  function setLive(kind, text) {
    var d = $("liveDot"); d.className = "dot" + (kind ? " " + kind : "");
    $("liveText").textContent = text;
  }
  function fmt(n, d) { if (n === null || n === undefined) return "-"; if (typeof n !== "number") return String(n);
                       return d === undefined ? String(n) : n.toFixed(d); }
  function shortId(s, n) { if (!s) return "-"; return s.length > n ? s.slice(0, n) + "…" : s; }
  function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
  function timeStr(ts) { if (!ts) return "-"; var d = new Date(ts * 1000);
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (x) { return String(x).padStart(2, "0"); }).join(":"); }
  function thr(p) { return p == null ? "" : p >= 90 ? "k-bad" : p >= 70 ? "k-warn" : "k-ok"; }
  function thrColor(p) { return p >= 90 ? "var(--red)" : p >= 70 ? "var(--orange)" : "var(--green)"; }
  function stateBadge(st) {
    var kind = STATE_KIND[st] || ""; var zh = STATE_ZH[st] || st;
    var dot = kind === "ok" ? "ok" : kind === "warn" ? "warn" : kind === "bad" ? "bad" : "";
    return '<span class="badge ' + kind + '">' + (dot ? '<span class="dot ' + dot + '"></span>' : "") + zh + '</span>';
  }

  function renderKpis(s) {
    var p = s.pool || {}, led = s.ledger, sup = s.supervisor;
    var memPct = led ? pct(led.mem_in_use_mib, led.mem_capacity_mib) : null;
    var cpuPct = led ? pct(led.cpu_in_use, led.cpu_capacity) : null;
    var supAll = sup ? (sup.reaper && sup.health && sup.metrics) : null;
    var brk = p.replenish_breaker_open;
    var cells = [
      { label: "在租沙箱", val: p.leased != null ? p.leased : "-", sub: "池 " + (p.size != null ? p.size : "-") + " / 上限 " + (p.max_size != null ? p.max_size : "-") },
      { label: "暖池空闲", val: p.idle != null ? p.idle : "-", sub: "下限 " + (p.min_size != null ? p.min_size : "-") },
      { label: "内存准入", val: memPct != null ? memPct + "%" : "-", cls: thr(memPct), sub: led ? (led.mem_in_use_mib + " / " + led.mem_capacity_mib + " MiB") : "无账本" },
      { label: "CPU 准入", val: cpuPct != null ? cpuPct + "%" : "-", cls: thr(cpuPct), sub: led ? (led.cpu_in_use + " / " + led.cpu_capacity + " vCPU") : "无账本" },
      { label: "补货熔断", val: brk == null ? "-" : brk ? "已熔断" : "正常", cls: brk == null ? "" : brk ? "k-bad" : "k-ok", sub: p.replenish_failures != null ? ("连续失败 " + p.replenish_failures) : "" },
      { label: "巡检循环", val: sup ? (supAll ? "正常" : "异常") : "-", cls: sup ? (supAll ? "k-ok" : "k-bad") : "", sub: sup ? ("回收 " + (sup.reaper ? "✓" : "✗") + " · 健康 " + (sup.health ? "✓" : "✗") + " · 指标 " + (sup.metrics ? "✓" : "✗")) : "无" },
    ];
    $("kpis").innerHTML = cells.map(function (c) {
      return '<div class="kpi"><div class="k-label">' + c.label + '</div>' +
        '<div class="k-val ' + (c.cls || "") + '">' + c.val + '</div>' +
        '<div class="k-sub">' + (c.sub || "") + '</div></div>';
    }).join("");
  }
  function gauge(label, inUse, cap, unit) {
    var p = pct(inUse, cap);
    return '<div class="gauge"><div class="g-top"><span>' + label + '</span><span class="g-val">' +
      inUse + ' / ' + cap + ' ' + unit + '  (' + p + '%)</span></div>' +
      '<div class="track"><div class="fill" style="width:' + p + '%;background:' + thrColor(p) + '"></div></div></div>';
  }
  function renderCapacity(s) {
    if (!s.ledger) { $("capacity").innerHTML = '<div class="empty">沙箱后端为 ' + s.kind + ',未启用准入账本(账本仅 smolvm 生效)</div>'; return; }
    var q = s.quota || {};
    $("capacity").innerHTML = gauge("内存(不超卖)", s.ledger.mem_in_use_mib, s.ledger.mem_capacity_mib, "MiB") +
      gauge("CPU(超卖计)", s.ledger.cpu_in_use, s.ledger.cpu_capacity, "vCPU") +
      '<div class="quota">每台配额 ' + (q.mem_mib || "-") + ' MiB · ' + (q.vcpus || "-") + ' vCPU</div>';
  }
  function renderDist(s) {
    var c = s.state_counts || {}, keys = Object.keys(c).sort();
    if (!keys.length) { $("dist").innerHTML = '<div class="empty">无活跃 smolvm 会话</div>'; return; }
    $("dist").innerHTML = keys.map(function (k) {
      return '<div class="dist-row"><span>' + stateBadge(k) + '</span><span class="num">' + c[k] + '</span></div>';
    }).join("");
  }
  function renderFleet(s) {
    var rows = (s.sandboxes || []).slice(), body = $("fleetBody");
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="9"><div class="empty">当前无在租沙箱' +
        (s.kind !== "smolvm" ? '(沙箱后端为 ' + s.kind + ',本台面向 smolvm)' : '') + '</div></td></tr>';
      updateHeaders(); return;
    }
    var sk = state.sort.key, dir = state.sort.dir;
    rows.sort(function (a, b) {
      var x = a[sk], y = b[sk];
      if (x == null) return 1; if (y == null) return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
    body.innerHTML = rows.map(function (r) {
      var pidCell = r.pid == null ? '<span class="faint">-</span>'
        : r.pid + ' <span class="' + (r.pid_alive ? "yes" : "no") + '">' + (r.pid_alive ? "存活" : "已死") + '</span>';
      return '<tr>' +
        '<td>' + shortId(r.project_id, 12) + '</td>' +
        '<td class="dim">' + (r.vm_id || "-") + '</td>' +
        '<td>' + stateBadge(r.state) + '</td>' +
        '<td class="dim zh">' + (r.node || "-") + '</td>' +
        '<td><span class="zh">' + pidCell + '</span></td>' +
        '<td class="r">' + fmt(r.rss_mib, r.rss_mib != null ? 1 : undefined) + '</td>' +
        '<td class="r">' + fmt(r.cpu_seconds, r.cpu_seconds != null ? 1 : undefined) + '</td>' +
        '<td class="r">' + fmt(r.idle_seconds, r.idle_seconds != null ? 0 : undefined) + '</td>' +
        '<td class="dim">' + (r.snapshot_id ? shortId(r.snapshot_id, 18) : '<span class="faint">-</span>') + '</td>' +
        '</tr>';
    }).join("");
    updateHeaders();
  }
  function updateHeaders() {
    document.querySelectorAll("#fleet thead th").forEach(function (th) {
      var base = th.textContent.replace(/\s*[↑↓]$/, "");
      th.textContent = base;
      if (th.dataset.k === state.sort.key) {
        th.innerHTML = base + ' <span class="arrow">' + (state.sort.dir > 0 ? "↑" : "↓") + "</span>";
      }
    });
  }
  function renderFeed(events) {
    var feed = $("feed");
    var list = events.filter(function (e) { return state.showMetrics || e.event !== "metrics"; });
    if (!list.length) { feed.innerHTML = '<div class="empty">暂无事件</div>'; return; }
    var newIds = new Set();
    feed.innerHTML = list.map(function (e, i) {
      var id = e.ts + "|" + (e.vm_id || "") + "|" + e.event + "|" + i;
      newIds.add(id);
      var fresh = !state.firstLoad && !state.lastIds.has(id) ? " fresh" : "";
      var d = "";
      if (e.detail) {
        if (e.detail.reason) d = e.detail.reason;
        else if (e.detail.snapshot_id) d = "快照 " + shortId(e.detail.snapshot_id, 20);
        else if (e.detail.error) d = e.detail.error;
        else if (e.event === "metrics" && e.detail.rss_bytes != null)
          d = "内存 " + (e.detail.rss_bytes / 1048576).toFixed(1) + " MiB · CPU " + fmt(e.detail.cpu_seconds, 1) + " 秒";
      }
      return '<div class="ev sev-' + (SEV[e.event] || "info") + fresh + '">' +
        '<span class="ev-t">' + timeStr(e.ts) + '</span>' +
        '<span class="ev-k">' + (EVENT_ZH[e.event] || e.event) + '</span>' +
        '<span class="ev-vm">' + (e.vm_id || (e.project_id ? shortId(e.project_id, 12) : "-")) + '</span>' +
        '<span class="ev-d">' + d + '</span></div>';
    }).join("");
    state.lastIds = newIds;
  }
  function skeletons() {
    $("kpis").innerHTML = Array.from({ length: 6 }).map(function () {
      return '<div class="kpi"><div class="sk" style="width:50%"></div>' +
        '<div class="sk" style="height:26px;margin-top:10px"></div>' +
        '<div class="sk" style="width:70%;margin-top:10px"></div></div>';
    }).join("");
    $("fleetBody").innerHTML = '<tr><td colspan="9"><div class="sk" style="height:44px"></div></td></tr>';
  }

  async function tick() {
    try {
      var r = await Promise.all([getJSON("/ops/state"), getJSON("/ops/events?limit=120")]);
      var s = r[0], ev = r[1];
      $("errbar").classList.remove("show");
      $("provider").textContent = s.kind || "-";
      var upd = $("updated"); upd.textContent = timeStr(s.generated_at);
      upd.classList.remove("go"); void upd.offsetWidth; upd.classList.add("go");
      setLive("ok", "已连接");
      renderKpis(s); renderCapacity(s); renderDist(s); renderFleet(s);
      renderFeed(ev.events || []);
      state.firstLoad = false;
    } catch (err) {
      setLive("bad", "已断开");
      $("errmsg").textContent = "拉取失败:" + err.message + "(请检查 API 地址 / 密钥,或后端是否在运行)";
      $("errbar").classList.add("show");
    }
  }
  function schedule() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
    if (state.intervalMs > 0) state.timer = setInterval(tick, state.intervalMs);
  }
  function applyAppearance(mode) {
    document.documentElement.setAttribute("data-appearance", mode);
    $("appIcon").className = mode === "dark" ? "ph ph-sun" : "ph ph-moon";
    localStorage.setItem(LS.app, mode);
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      state.intervalMs = parseInt(b.dataset.ms, 10);
      if (state.intervalMs === 0) setLive("warn", "已暂停"); else tick();
      schedule();
    });
  });
  $("appearanceBtn").addEventListener("click", function () {
    applyAppearance(document.documentElement.getAttribute("data-appearance") === "dark" ? "light" : "dark");
  });
  $("settingsBtn").addEventListener("click", function () {
    var s = $("settings"); s.classList.toggle("show");
    $("apiBase").value = base(); $("apiKey").value = key();
  });
  $("saveBtn").addEventListener("click", function () {
    localStorage.setItem(LS.base, $("apiBase").value.trim());
    localStorage.setItem(LS.key, $("apiKey").value.trim());
    $("settings").classList.remove("show"); skeletons(); tick();
  });
  $("retryBtn").addEventListener("click", tick);
  $("showMetrics").addEventListener("change", function () { state.showMetrics = this.checked; tick(); });
  document.querySelectorAll("#fleet thead th").forEach(function (th) {
    th.addEventListener("click", function () {
      var k = th.dataset.k;
      if (state.sort.key === k) state.sort.dir *= -1; else { state.sort.key = k; state.sort.dir = 1; }
      tick();
    });
  });

  applyAppearance(localStorage.getItem(LS.app) || "light");
  skeletons(); tick(); schedule();
})();
</script>
</body>
</html>
