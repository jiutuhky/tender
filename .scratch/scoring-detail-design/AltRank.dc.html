<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #0064e1; } a:hover { color: #0052bc; }

    .wrap {
      --surface: #ffffff; --surface-2: #f5f6f8; --surface-3: #eceef1;
      --label: #1d1d1f; --label-2: #55555e; --label-3: #6b6b76;
      --separator: rgba(60, 60, 67, .12);
      --blue: #0064e1; --blue-press: #0052bc; --blue-soft: rgba(0, 100, 225, .10);
      --red: #ff3b30; --red-text: #d70015;
      --r-control: 7px; --r-field: 9px; --r-window: 12px;
      --elev-1: 0 1px 2px rgba(18, 24, 38, .10), 0 0 0 .5px rgba(18, 24, 38, .07);
      --t-micro: 120ms; --ease-std: cubic-bezier(.32, .72, 0, 1);
      --pad: 20px;

      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: var(--surface); color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap[data-appearance="dark"] {
      --surface: #1e1e22; --surface-2: #2a2a30; --surface-3: #33333a;
      --label: #f5f5f7; --label-2: #a8a8b3; --label-3: #8a8a95;
      --separator: rgba(255, 255, 255, .10);
      --blue: #409cff; --blue-press: #1f7fe0; --blue-soft: rgba(64, 156, 255, .16);
      --red-text: #ff6961;
      --elev-1: 0 1px 2px rgba(0, 0, 0, .40), 0 0 0 .5px rgba(255, 255, 255, .08);
      color-scheme: dark;
    }

    .head { display: flex; align-items: center; gap: 11px; padding: 16px 18px; box-shadow: inset 0 -.5px 0 var(--separator); flex: 0 0 auto; }
    .head > svg { flex: 0 0 auto; color: var(--label-3); }
    .titlebox { flex: 1; min-width: 0; }
    .title { font-size: 14.5px; font-weight: 700; letter-spacing: -.005em; }
    .sub { font-size: 11px; color: var(--label-3); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .close { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border: 0; background: var(--surface-2); color: var(--label-2); border-radius: var(--r-control); cursor: pointer; }
    .close:hover { background: var(--surface-3); color: var(--label); }

    .body { flex: 1; min-height: 0; overflow: auto; padding: 18px var(--pad); }

    .veto { margin: 0 0 16px; padding-bottom: 2px; border-bottom: 1px solid var(--separator); }
    .veto-title { display: flex; align-items: center; gap: 7px; padding: 2px 0 8px; font-size: 12.5px; font-weight: 700; color: var(--red-text); }
    .veto-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .veto-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--separator); font-size: 12.5px; line-height: 1.75; }
    .veto-no { flex: 0 0 auto; min-width: 15px; font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }

    /* ---- 分值排行：11 项评审因素按分值排序，条长即分值，条色即所属一级项 ---- */
    .rank-head { display: flex; align-items: baseline; gap: 8px; padding: 2px 0 9px; }
    .rank-head b { font-size: 12px; font-weight: 700; letter-spacing: -.005em; }
    .rank-head .n { font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .rank-legend { margin-left: auto; display: flex; gap: 10px; font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .rank-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .rank-legend i { width: 8px; height: 8px; border-radius: 3px; flex: 0 0 auto; }

    .rbar { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 4px 6px; margin: 0 -6px; border-radius: var(--r-control); cursor: pointer; text-align: left; transition: background-color var(--t-micro) var(--ease-std); }
    .rbar:hover { background: var(--surface-2); }
    .rbar:active { transform: scale(.995); }
    .rbar-name { flex: 0 0 auto; width: 118px; font-size: 12px; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rbar.is-off .rbar-name { color: var(--label-3); }
    .rbar-track { flex: 1; min-width: 0; height: 9px; }
    .rbar-fill { display: block; height: 100%; border-radius: 999px; transition: opacity var(--t-micro) var(--ease-std); }
    .rbar-val { flex: 0 0 auto; width: 34px; text-align: right; font-size: 12px; font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }
    .rbar.is-off .rbar-val { color: var(--label-3); font-weight: 500; }
    .rbar.is-off .rbar-fill { opacity: .34; }

    .k1 { background: color-mix(in srgb, var(--label) 52%, transparent); }
    .k2 { background: color-mix(in srgb, var(--label) 34%, transparent); }
    .k3 { background: color-mix(in srgb, var(--label) 22%, transparent); }

    .navbar { position: sticky; top: -18px; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 14px calc(-1 * var(--pad)) 2px; padding: 10px var(--pad); background: var(--surface); border-bottom: 1px solid var(--separator); }
    .seg { display: flex; gap: 2px; width: max-content; max-width: 100%; padding: 2px; border-radius: var(--r-field); background: color-mix(in srgb, var(--separator) 67%, transparent); }
    .seg button { border: 0; background: transparent; font-size: 12px; font-weight: 600; color: var(--label-2); padding: 4px 11px; border-radius: var(--r-control); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; transition: color var(--t-micro) var(--ease-std), background-color var(--t-micro) var(--ease-std), transform var(--t-micro) var(--ease-std); }
    .seg button:hover { color: var(--label); }
    .seg button:active { transform: scale(.97); }
    .seg button.is-active { background: var(--surface); color: var(--label); box-shadow: var(--elev-1); }
    .seg .s-n { color: var(--label-3); font-weight: 600; margin-left: 4px; }
    .seg button.is-active .s-n { color: var(--label-2); }
    .curtag { margin-left: auto; font-size: 11.5px; color: var(--label-3); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .gh { display: flex; align-items: baseline; gap: 8px; padding: 18px 0 5px; }
    .gh b { font-size: 12px; font-weight: 700; letter-spacing: -.005em; }
    .gh .n { font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .gh .g-s { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--label-3); font-variant-numeric: tabular-nums; }

    .srow { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--separator); }
    .srow.is-first { border-top: 0; }
    .smain { flex: 1; min-width: 0; }
    .stitle { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; font-weight: 500; }
    .srule { margin: 3px 0 0; font-size: 12px; line-height: 1.7; color: var(--label-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sfoot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; }
    .chip { display: inline-flex; align-items: center; border: 0; font-size: 10.5px; font-weight: 600; color: var(--label-3); background: transparent; box-shadow: inset 0 0 0 .5px var(--separator); padding: 2.5px 9px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
    .chip:hover { background: var(--blue-soft); color: var(--blue); box-shadow: none; }
    .scell { flex: 0 0 auto; width: 34px; text-align: right; }
    .snum { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .mark { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11px; color: var(--label-2); white-space: nowrap; }
    .mark::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--red); flex: 0 0 auto; transform: translateY(-2px); }
    .hide { display: none !important; }
    .tail { padding: 16px 0 26px; font-size: 11.5px; color: var(--label-3); text-align: center; }
  </style>
</helmet>

<div class="wrap" data-appearance="{{mode}}">

  <div class="head">
    <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 216h192"></path><path d="M56 216V128h40v88"></path><path d="M96 216V72h40v144"></path><path d="M136 216v-56h40v56"></path>
    </svg>
    <div class="titlebox">
      <div class="title">评分办法</div>
      <div class="sub">综合评分法 · 总分 100 · 30 项评分项</div>
    </div>
    <button type="button" class="close" aria-label="关闭">
      <svg width="15" height="15" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
        <path d="M200 56 56 200"></path><path d="M200 200 56 56"></path>
      </svg>
    </button>
  </div>

  <div class="body">

    <section class="veto">
      <div class="veto-title">
        <svg width="15" height="15" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="128" cy="128" r="96"></circle><path d="M60.1 60.1 195.9 195.9"></path>
        </svg>
        否决项 / 通过性条款
        <span class="veto-count">9 条</span>
      </div>
      <div class="veto-row"><span class="veto-no">01</span><div style="min-width:0">不具备招标文件中规定的资格性要求的，按照无效投标处理。</div></div>
      <div class="veto-row"><span class="veto-no">02</span><div style="min-width:0">技术和商务的实质性条款不满足招标文件要求的，按照无效投标处理。</div></div>
    </section>

    <div class="rank-head">
      <b>分值分布</b>
      <span class="n">11 项评审因素</span>
      <span class="rank-legend">
        <span><i class="k1"></i>技术</span>
        <span><i class="k2"></i>价格</span>
        <span><i class="k3"></i>商务</span>
      </span>
    </div>
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
      <button type="button" class="{{b.cls}}" onClick="{{b.pick}}">
        <span class="rbar-name">{{b.name}}</span>
        <span class="rbar-track"><i class="{{b.fillCls}}" style="width: {{b.w}}"></i></span>
        <span class="rbar-val">{{b.score}}</span>
      </button>
    </sc-for>

    <div class="navbar">
      <div class="seg" role="group" aria-label="一级评审项">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
          <button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">
            {{c.name}}<span class="s-n">{{c.score}}</span>
          </button>
        </sc-for>
      </div>
      <span class="curtag">{{curTag}}</span>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <sc-if value="{{r.isHead}}" hint-placeholder-val="{{true}}">
        <div class="gh"><b>{{r.name}}</b><span class="n">{{r.count}} 项</span><span class="g-s">{{r.score}} 分</span></div>
      </sc-if>
      <sc-if value="{{r.isItem}}" hint-placeholder-val="{{true}}">
        <div class="{{r.rowCls}}">
          <div class="smain">
            <div class="stitle"><span class="{{r.markCls}}">否决</span><span>{{r.t}}</span></div>
            <p class="srule">{{r.rule}}</p>
            <div class="sfoot"><button type="button" class="chip">行 {{r.line}}</button></div>
          </div>
          <span class="scell"><span class="snum">{{r.s}}</span></span>
        </div>
      </sc-if>
    </sc-for>

    <div class="tail">{{tail}}</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"外观"},"$preview":{"width":548,"height":900}}'>

          { t: "近三年平均净资产总额排序", s: 1, line: "1091", rule: "以近三年财务审计报告数据为准，由大至小排序，其余依次按标准分值的 20% 递减。" },
          { t: "近三年平均资产总额排序", s: 1, line: "1092", rule: "以近三年财务审计报告数据为准，由大至小排序，其余依次按标准分值的 20% 递减。" },
        ] },
        { name: "财务状况", items: [
          { t: "近三年平均净利润排序", s: 1, line: "1093", rule: "由大至小排序，排名第一的得标准分值，净利润为负值的得 0 分。" },
          { t: "近三年平均资产负债率", s: 1, line: "1094", rule: "低于 50%（含）得标准分值，50%～70%（含）得 50%，70% 以上为 0 分。" },
          { t: "近三年平均营业收入排序", s: 2, line: "1095", rule: "由大至小排序，排名第一的得标准分值，其余依次按标准分值的 20% 递减。" },
        ] },
        { name: "企业信誉", items: [
          { t: "近三年纳税信用 A 级评价", s: 2, line: "1096", rule: "连续三年取得的得标准分值，取得过两次的得 50%，一次的得 25%。" },
          { t: "近三年未列入军队采购失信名单", s: 2, line: "1097", rule: "以采购机构查询军队采购网内网处罚截止日期为准，未被列入的得标准分值。" },
        ] },
      ] },
      { key: "technical", name: "技术", full: "技术评审", shade: "k1", groups: [
        { name: "技术力量", items: [
          { t: "ISO 9001 / GJB 9001 质量管理体系", s: 1, line: "1113", rule: "取得且处于有效期内的认证证书的得标准分值，没有或无效的为 0 分。" },
          { t: "ISO 27001 信息安全管理体系", s: 1, line: "1113", rule: "取得且处于有效期内的认证证书的得标准分值，没有或无效的为 0 分。" },

          { t: "GJB 5000 软件能力成熟度等级", s: 1, line: "1113", rule: "五级得标准分值，四级得 60%，三级得 30%，否则为 0 分。" },
          { t: "项目负责人信息系统项目管理师", s: 1, line: "1114", rule: "拟派项目负责人取得证书的得标准分值，须附身份证、证书与连续 3 个月社保证明。" },
        ] },
        { name: "技术方案", items: [
          { t: "需求分析的全面性、准确性、充分性", s: 3, line: "1115", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },
          { t: "系统架构设计的合理性、针对性", s: 3, line: "1116", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },
          { t: "系统功能描述与接口设计", s: 3, line: "1117", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },
          { t: "集成和实施方案的合理性、完整性、可靠性", s: 4, line: "1118", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },
          { t: "系统安全保密方案", s: 3, line: "1119", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },
          { t: "试验验证方案", s: 4, line: "1120", rule: "最优的得标准分值，其余依次按标准分值的 5% 递减，最低分为 0 分。" },

        { name: "一般技术指标评审", items: [

          { t: "一般技术指标负偏离评分", s: 13, gate: true, line: "1121", rule: "全部满足采购文件要求的得标准分值，负偏离一项扣 1 分，最低为 0 分。" },
        ] },
        { name: "项目管理与实施", items: [
          { t: "实施周期与进度安排", s: 0.5, line: "1122", rule: "根据项目实施周期和进度安排的合理性进行评审，最优的得标准分值。" },
          { t: "组织管理与质量保证措施", s: 0.5, line: "1122", rule: "根据管理组织、人员管理措施、质量保证措施的合理性与完备性进行评审。" },
          { t: "项目风险评估及控制方案", s: 0.5, line: "1122", rule: "根据风险因素分析、风险评估防范及风险控制措施进行评审。" },
        ] },
        { name: "培训和售后服务", items: [
          { t: "培训计划方案", s: 0.5, line: "1122", rule: "根据培训计划方案进行评审，最优的得标准分值。" },
          { t: "项目整体免费质保期", s: 4, line: "1122", rule: "在满足采购文件要求的基础上，每增加 12 个月得 1 分，最多得标准分值。" },
          { t: "维修响应时间承诺", s: 2, line: "1122", rule: "维修响应时间综合最优的得标准分值；三分之二以上技术专家认为承诺不合理的为 0 分。" },
        ] },
      ] },
    ];
  }

  fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  renderVals() {
    const cats = this.data();
    const stat = cats.map((c) => {
      const items = c.groups.reduce((a, g) => a.concat(g.items), []);
      return { key: c.key, name: c.name, full: c.full, shade: c.shade, groups: c.groups, items: items,
               score: items.reduce((a, it) => a + it.s, 0) };
    });
    const total = stat.reduce((a, s) => a + s.score, 0);

    // 排行条：所有二级评审因素拉平后按分值降序，条色标明所属一级项
    const flat = [];
    stat.forEach((s) => s.groups.forEach((g) => {
      flat.push({ name: g.name, catKey: s.key, shade: s.shade, score: g.items.reduce((a, i) => a + i.s, 0) });
    }));
    flat.sort((a, b) => b.score - a.score);
    const top = flat[0].score;
    const bars = flat.map((f) => ({
      name: f.name,
      score: this.fmt(f.score),
      w: (Math.max(f.score / top, 0.02) * 100).toFixed(1) + "%",
      fillCls: "rbar-fill " + f.shade,
      cls: "rbar" + (f.catKey === this.state.cat ? "" : " is-off"),
      pick: () => this.setState({ cat: f.catKey }),
    }));

    const cur = stat.find((s) => s.key === this.state.cat) || stat[0];
    const rows = [];
    cur.groups.forEach((g) => {
      const gs = g.items.reduce((a, i) => a + i.s, 0);
      rows.push({ isHead: true, isItem: false, name: g.name, count: g.items.length, score: this.fmt(gs) });
      g.items.forEach((it, i) => rows.push({
        isItem: true, isHead: false,
        t: it.t, s: this.fmt(it.s), line: it.line, rule: it.rule,
        rowCls: "srow" + (i === 0 ? " is-first" : ""),
        markCls: it.gate ? "mark" : "hide",
      }));
    });

    return {
      bars: bars,
      cats: stat.map((s) => ({
        name: s.name, score: this.fmt(s.score),
        cls: s.key === this.state.cat ? "is-active" : "",
        on: s.key === this.state.cat,
        pick: () => this.setState({ cat: s.key }),
      })),
      curTag: cur.full + " · 占总分 " + Math.round(cur.score / total * 100) + "%",
      rows: rows,
      tail: cur.count + " 项已全部列出 · 共 " + this.fmt(cur.score) + " 分",
    };
  }
}
</script>
</body>
</html>
