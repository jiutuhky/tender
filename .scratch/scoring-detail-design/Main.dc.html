<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #0064e1; } a:hover { color: #0052bc; }

    .wrap {
      --surface: #ffffff; --surface-2: #f5f6f8; --surface-3: #eceef1;
      --label: #1d1d1f; --label-2: #55555e; --label-3: #6b6b76;
      --separator: rgba(60, 60, 67, .12);
      --blue: #0064e1; --blue-press: #0052bc; --blue-soft: rgba(0, 100, 225, .10);
      --green: #34c759; --green-text: #1d8f45;
      --orange: #ff9500; --orange-text: #b25e00;
      --red: #ff3b30; --red-text: #d70015;
      --r-control: 7px; --r-field: 9px; --r-window: 12px; --r-card: 14px; --r-panel: 18px;
      --elev-1: 0 1px 2px rgba(18, 24, 38, .10), 0 0 0 .5px rgba(18, 24, 38, .07);
      --t-micro: 120ms; --ease-std: cubic-bezier(.32, .72, 0, 1);
      --pad: 20px;

      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      background: var(--surface);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap[data-appearance="dark"] {
      --surface: #1e1e22; --surface-2: #2a2a30; --surface-3: #33333a;
      --label: #f5f5f7; --label-2: #a8a8b3; --label-3: #8a8a95;
      --separator: rgba(255, 255, 255, .10);
      --blue: #409cff; --blue-press: #1f7fe0; --blue-soft: rgba(64, 156, 255, .16);
      --green-text: #30d158; --orange-text: #ff9f0a; --red-text: #ff6961;
      --elev-1: 0 1px 2px rgba(0, 0, 0, .40), 0 0 0 .5px rgba(255, 255, 255, .08);
      color-scheme: dark;
    }

    /* ---- 抽屉头（沿用 .cv-drawer-head 度量） ---- */
    .head { display: flex; align-items: center; gap: 11px; padding: 16px 18px; box-shadow: inset 0 -.5px 0 var(--separator); flex: 0 0 auto; }
    .head > svg { flex: 0 0 auto; color: var(--label-3); }
    .titlebox { flex: 1; min-width: 0; }
    .title { font-size: 14.5px; font-weight: 700; letter-spacing: -.005em; }
    .sub { font-size: 11px; color: var(--label-3); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .close { display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto; border: 0; background: var(--surface-2); color: var(--label-2); border-radius: var(--r-control); cursor: pointer; }
    .close:hover { background: var(--surface-3); color: var(--label); }

    .body { flex: 1; min-height: 0; overflow: auto; padding: 18px var(--pad); }

    /* ---- 否决项：折叠带，排在概览带之后 ----
       它是「读一次就不再看」的信息，而分值构成要反复参照 —— 所以否决项收成一条恒定高度的
       带，条数再多也不会把环形图挤出首屏。折叠态仍报出条数与最要命的一条，不是零信息。
       仍然不做彩色填充块 / 彩色左边线：语义色只落图标与标题字。 */
    .veto { margin: 0 0 4px; padding: 12px 0; border-top: 1px solid var(--separator); }
    .veto-btn { display: flex; align-items: center; gap: 7px; width: calc(100% + 12px); margin: 0 -6px; padding: 3px 6px; border: 0; background: transparent; border-radius: var(--r-control); cursor: pointer; text-align: left; font-size: 12.5px; font-weight: 700; letter-spacing: -.005em; color: var(--red-text); font-family: inherit; transition: background-color var(--t-micro) var(--ease-std); }
    .veto-btn:hover { background: var(--surface-2); }
    .veto-btn > svg { flex: 0 0 auto; }
    .veto-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .vcaret { flex: 0 0 auto; color: var(--label-3); transition: transform var(--t-micro) var(--ease-std); }
    .vcaret.is-open { transform: rotate(180deg); }
    .veto-peek { margin-top: 5px; padding-left: 22px; font-size: 12px; line-height: 1.6; color: var(--label-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .veto-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--separator); font-size: 12.5px; line-height: 1.75; overflow-wrap: anywhere; }
    .veto-row.is-first { margin-top: 8px; }
    .veto-no { flex: 0 0 auto; min-width: 15px; font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }

    /* ---- 分值结构：环形图 + 当前一级项读数 ---- */
    .struct { display: flex; align-items: center; gap: 18px; padding: 2px 0 12px; }
    .donut { flex: 0 0 auto; }
    .arc { fill: none; stroke-linecap: butt; cursor: pointer; transition: stroke var(--t-micro) var(--ease-std), opacity var(--t-micro) var(--ease-std); }
    .arc.a1 { stroke: color-mix(in srgb, var(--label) 52%, transparent); }
    .arc.a2 { stroke: color-mix(in srgb, var(--label) 34%, transparent); }
    .arc.a3 { stroke: color-mix(in srgb, var(--label) 22%, transparent); }
    .arc.a4 { stroke: color-mix(in srgb, var(--label) 10%, transparent); }
    .arc.is-dim { opacity: .38; }
    .arc.is-on { stroke: var(--label); opacity: 1; }
    .donut:hover .arc.is-dim { opacity: .55; }
    .dnum { font-size: 25px; font-weight: 700; fill: var(--label); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .dcap { font-size: 10px; font-weight: 500; fill: var(--label-3); letter-spacing: .04em; }

    .readout { flex: 1; min-width: 0; }
    .ro-name { font-size: 12px; font-weight: 700; color: var(--label); letter-spacing: -.005em; }
    .ro-line { display: flex; align-items: baseline; gap: 7px; margin-top: 3px; }
    .ro-big { font-size: 27px; font-weight: 700; letter-spacing: -.022em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .ro-unit { font-size: 12px; color: var(--label-2); font-weight: 600; }
    .ro-pct { margin-left: auto; font-size: 11.5px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .ro-meta { margin-top: 5px; font-size: 11.5px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .ro-hint { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--separator); font-size: 11.5px; line-height: 1.6; color: var(--label-2); }
    .ro-hint b { font-weight: 600; color: var(--label); }

    /* ---- 吸顶切换条（沿用 .cv-det-head / .cv-det-seg） ---- */
    .navbar { position: sticky; top: -18px; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 0 calc(-1 * var(--pad)) 2px; padding: 10px var(--pad); background: var(--surface); border-bottom: 1px solid var(--separator); }
    .seg { display: flex; gap: 2px; width: max-content; max-width: 100%; padding: 2px; border-radius: var(--r-field); background: color-mix(in srgb, var(--separator) 67%, transparent); }
    .seg button { border: 0; background: transparent; font-size: 12px; font-weight: 600; color: var(--label-2); padding: 4px 11px; border-radius: var(--r-control); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; transition: color var(--t-micro) var(--ease-std), background-color var(--t-micro) var(--ease-std), transform var(--t-micro) var(--ease-std); }
    .seg button:hover { color: var(--label); }
    .seg button:active { transform: scale(.97); }
    .seg button.is-active { background: var(--surface); color: var(--label); box-shadow: var(--elev-1); }
    .seg .s-n { color: var(--label-3); font-weight: 600; margin-left: 4px; }
    .seg button.is-active .s-n { color: var(--label-2); }
    .sortbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--label-3); font-size: 11.5px; font-weight: 600; padding: 4px 7px; border-radius: var(--r-control); cursor: pointer; white-space: nowrap; }
    .sortbtn:hover { background: var(--surface-2); color: var(--label); }
    .sortbtn:active { transform: scale(.97); }

    /* ---- 分组眉 + 评分项行 ---- */
    .gh { display: flex; align-items: baseline; gap: 8px; padding: 18px 0 5px; }
    .gh b { font-size: 12px; font-weight: 700; letter-spacing: -.005em; }
    .gh .n { font-size: 11px; color: var(--label-3); font-variant-numeric: tabular-nums; }
    .gh .g-s { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--label-3); font-variant-numeric: tabular-nums; }

    .srow { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--separator); }
    .srow.is-first { border-top: 0; }
    .smain { flex: 1; min-width: 0; }
    .stitle { display: flex; align-items: baseline; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--label); }
    .srule { margin: 3px 0 0; font-size: 12px; line-height: 1.7; color: var(--label-3); }
    .srule.is-clamped { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sfoot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; }
    .chip { display: inline-flex; align-items: center; border: 0; font-size: 10.5px; font-weight: 600; color: var(--label-3); background: transparent; box-shadow: inset 0 0 0 .5px var(--separator); padding: 2.5px 9px; border-radius: 999px; white-space: nowrap; cursor: pointer; font-variant-numeric: tabular-nums; transition: color var(--t-micro) var(--ease-std), background-color var(--t-micro) var(--ease-std), box-shadow var(--t-micro) var(--ease-std); }
    .chip:hover { background: var(--blue-soft); color: var(--blue); box-shadow: none; }
    .more { border: 0; background: transparent; padding: 2.5px 4px; font-size: 10.5px; font-weight: 600; color: var(--label-3); cursor: pointer; border-radius: var(--r-control); }
    .more:hover { color: var(--blue); background: var(--blue-soft); }

    .scell { flex: 0 0 auto; width: 46px; text-align: right; }
    .snum { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .sbar { display: block; height: 3px; border-radius: 999px; margin: 4px 0 0 auto; background: color-mix(in srgb, var(--label) 34%, transparent); }

    .mark { display: inline-flex; align-items: baseline; gap: 5px; font-size: 11px; color: var(--label-2); white-space: nowrap; }
    .mark::before { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--red); flex: 0 0 auto; transform: translateY(-2px); }
    .hide { display: none !important; }

    .tail { padding: 16px 0 26px; font-size: 11.5px; color: var(--label-3); text-align: center; }
  </style>
</helmet>

<div class="wrap" data-appearance="{{mode}}">

  <div class="head">
    <svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 24a104 104 0 1 0 104 104"></path>
      <path d="M128 24v104h104A104 104 0 0 0 128 24Z"></path>
    </svg>
    <div class="titlebox">
      <div class="title">评分办法</div>
      <div class="sub">综合评分法 · 总分 100 · 30 项评分项</div>
    </div>
    <button type="button" class="close" aria-label="关闭">
      <svg width="15" height="15" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
        <path d="M200 56 56 200"></path><path d="M200 200 56 56"></path>
      </svg>
    </button>
  </div>

  <div class="body">

    <section class="struct">
      <svg class="donut" width="124" height="124" viewBox="0 0 124 124" role="img" aria-label="分值结构">
        <sc-for list="{{arcs}}" as="a" hint-placeholder-count="3">
          <circle class="{{a.cls}}" cx="62" cy="62" r="46" stroke-width="13"
                  stroke-dasharray="{{a.dash}}" transform="{{a.rot}}"
                  onClick="{{a.pick}}"></circle>
        </sc-for>
        <text class="dnum" x="62" y="60" text-anchor="middle" dominant-baseline="middle">{{total}}</text>
        <text class="dcap" x="62" y="79" text-anchor="middle" dominant-baseline="middle">总分</text>
      </svg>
      <div class="readout">
        <div class="ro-name">{{cur.full}}</div>
        <div class="ro-line">
          <span class="ro-big">{{cur.score}}</span>
          <span class="ro-unit">分</span>
          <span class="ro-pct">占总分 {{cur.pct}}%</span>
        </div>
        <div class="ro-meta">{{cur.count}} 项评分项 · 单项最高 {{cur.top}} 分</div>
        <div class="ro-hint">分值集中在 <b>{{cur.hot}}</b>，共 {{cur.hotScore}} 分。</div>
      </div>
    </section>

    <section class="veto">
      <button type="button" class="veto-btn" aria-expanded="{{vetoOpen}}" onClick="{{toggleVeto}}">
        <svg width="15" height="15" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="128" cy="128" r="96"></circle><path d="M60.1 60.1 195.9 195.9"></path>
        </svg>
        否决项 / 通过性条款
        <span class="veto-count">{{vetoCount}} 条</span>
        <svg class="{{vcaretCls}}" width="13" height="13" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
          <path d="M208 96l-80 80-80-80"></path>
        </svg>
      </button>
      <div class="{{vetoPeekCls}}">{{vetoPeek}}</div>
      <div class="{{vetoListCls}}">
        <sc-for list="{{vetoRules}}" as="v" hint-placeholder-count="4">
          <div class="{{v.cls}}">
            <span class="veto-no">{{v.no}}</span>
            <div style="min-width:0">
              {{v.text}}
              <div class="sfoot"><button type="button" class="chip">行 {{v.line}}</button></div>
            </div>
          </div>
        </sc-for>
      </div>
    </section>

    <div class="navbar">
      <div class="seg" role="group" aria-label="一级评审项">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="3">
          <button type="button" class="{{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">
            {{c.name}}<span class="s-n">{{c.score}}</span>
          </button>
        </sc-for>
      </div>
      <button type="button" class="sortbtn" onClick="{{toggleSort}}">
        <svg width="13" height="13" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
          <path d="M80 200V56"></path><path d="M40 160l40 40 40-40"></path>
          <path d="M176 56v144"></path><path d="M216 96l-40-40-40 40"></path>
        </svg>
        {{sortLabel}}
      </button>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <sc-if value="{{r.isHead}}" hint-placeholder-val="{{true}}">
        <div class="gh"><b>{{r.name}}</b><span class="n">{{r.count}} 项</span><span class="g-s">{{r.score}} 分</span></div>
      </sc-if>
      <sc-if value="{{r.isItem}}" hint-placeholder-val="{{true}}">
        <div class="{{r.rowCls}}">
          <div class="smain">
            <div class="stitle">
              <span class="{{r.markCls}}">否决</span>
              <span>{{r.t}}</span>
            </div>
            <p class="{{r.ruleCls}}">{{r.rule}}</p>
            <div class="sfoot">
              <button type="button" class="chip">行 {{r.line}}</button>
              <button type="button" class="more" onClick="{{r.toggle}}">{{r.moreLabel}}</button>
            </div>
          </div>
          <span class="scell">
            <span class="snum">{{r.s}}</span>
            <i class="sbar" style="width: {{r.barW}}"></i>
          </span>
        </div>
      </sc-if>
    </sc-for>

    <div class="tail">{{tail}}</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light","section":"外观"},"$preview":{"width":548,"height":900}}'>
class Component extends DCLogic {

  fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  renderVals() {
    const cats = this.data();
    const stat = cats.map((c) => {
      const items = c.groups.reduce((a, g) => a.concat(g.items), []);
      const score = items.reduce((a, it) => a + it.s, 0);
      return { key: c.key, name: c.name, full: c.full, score: score, count: items.length, groups: c.groups, items: items };
    });
    const total = stat.reduce((a, s) => a + s.score, 0);

    // 段色按名次走中性灰阶（与卡面结构条 / 现状堆叠条同一套语汇，不动用四档蓝）
    const rank = stat.slice().sort((a, b) => b.score - a.score).map((s) => s.key);
    const shade = (k) => "a" + Math.min(rank.indexOf(k) + 1, 4);

    // 环形：按分段控件的顺序顺时针铺开，弧序即滑块序
    const R = 46, C = 2 * Math.PI * R, GAP = 3.4;
    let acc = 0;
    const arcs = stat.map((s) => {
      const len = C * s.score / total;
      const draw = Math.max(len - GAP, 1);
      const a = {
        cls: "arc " + shade(s.key) + (s.key === this.state.cat ? " is-on" : " is-dim"),
        dash: draw.toFixed(2) + " " + (C - draw).toFixed(2),
        rot: "rotate(" + (-90 + acc / C * 360).toFixed(2) + " 62 62)",
        pick: () => this.setState({ cat: s.key }),
      };
      acc += len;
      return a;
    });

    const cur = stat.find((s) => s.key === this.state.cat) || stat[0];
    const hot = cur.groups.slice().sort((a, b) => {
      const bs = b.items.reduce((x, i) => x + i.s, 0), as = a.items.reduce((x, i) => x + i.s, 0);
      return bs - as;
    })[0];
    const hotScore = hot.items.reduce((x, i) => x + i.s, 0);

    const maxItem = cur.items.reduce((m, it) => Math.max(m, it.s), 0);
    const mk = (it, first) => ({
      isItem: true, isHead: false,
      t: it.t, s: this.fmt(it.s), line: it.line, rule: it.rule,
      rowCls: "srow" + (first ? " is-first" : ""),
      markCls: it.gate ? "mark" : "hide",
      ruleCls: this.state.open === it.id ? "srule" : "srule is-clamped",
      moreLabel: this.state.open === it.id ? "收起" : "展开",
      barW: (Math.max(it.s / maxItem, 0.045) * 100).toFixed(1) + "%",
      toggle: () => this.setState({ open: this.state.open === it.id ? null : it.id }),
    });

    let rows = [];
    if (this.state.sort === "score") {
      // 分值序：拉平成一张排行榜，二级分组眉让位（分值序里它已不成立）
      rows = cur.items.slice().sort((a, b) => b.s - a.s).map((it, i) => mk(it, i === 0));
    } else {
      cur.groups.forEach((g) => {
        const gs = g.items.reduce((a, i) => a + i.s, 0);
        rows.push({ isHead: true, isItem: false, name: g.name, count: g.items.length, score: this.fmt(gs) });
        g.items.forEach((it, i) => rows.push(mk(it, i === 0)));
      });
    }

    const vetos = this.vetoData();
    const vOpen = this.state.veto;

    return {
      total: total,
      arcs: arcs,
      vetoOpen: vOpen,
      vetoCount: vetos.length,
      vetoRules: vetos.map((v, i) => ({
        no: String(i + 1).padStart(2, "0"), text: v.t, line: v.line,
        cls: "veto-row" + (i === 0 ? " is-first" : ""),
      })),
      vetoPeek: vetos[0].t,
      vetoPeekCls: vOpen ? "hide" : "veto-peek",
      vetoListCls: vOpen ? "" : "hide",
      vcaretCls: vOpen ? "vcaret is-open" : "vcaret",
      toggleVeto: () => this.setState({ veto: !this.state.veto }),
      cats: stat.map((s) => ({
        name: s.name, score: this.fmt(s.score),
        cls: s.key === this.state.cat ? "is-active" : "",
        on: s.key === this.state.cat,
        pick: () => this.setState({ cat: s.key, open: null }),
      })),
      cur: {
        full: cur.full, score: this.fmt(cur.score), count: cur.count,
        pct: Math.round(cur.score / total * 100),
        top: this.fmt(maxItem),
        hot: hot.name, hotScore: this.fmt(hotScore),
      },
      rows: rows,
      sortLabel: this.state.sort === "score" ? "原文顺序" : "按分值排序",
      toggleSort: () => this.setState({ sort: this.state.sort === "score" ? "doc" : "score" }),
      tail: cur.count + " 项已全部列出 · 共 " + this.fmt(cur.score) + " 分",
    };
  }
